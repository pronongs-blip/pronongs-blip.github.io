<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="오락실">
<meta name="description" content="오락실 · DEVIL'S ARCADE. 두뇌 서바이벌 아케이드 6종 — 벽바둑 2 · 흑과 백 · 기억포커 · 유배지 만국기 · 결! 합! · 인디언 포커.">
<title>오락실 · DEVIL'S ARCADE</title>
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" href="./apple-touch-icon.png">
<style>
:root{
  --bg:#0a0d14; --panel:#121826; --panel2:#161e2e; --panel3:#1b2438;
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.06);
  --txt:#f3f6fc; --dim:#9aa8c0; --dim2:#7b8aa5;
  --acc:#ffc247; --acc2:#5b8cff; --ok:#34d399;
  --acc-rgb:255,194,71;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  min-height:100%;
  color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Pretendard",system-ui,sans-serif;
  font-size:15px;
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
  word-break:keep-all;
  overflow-wrap:break-word;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(120% 70% at 50% -20%, #16203a 0%, rgba(10,13,20,0) 60%);
}

.portal{
  position:relative;z-index:1;
  width:100%;max-width:430px;margin:0 auto;
  min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 22px) 16px calc(env(safe-area-inset-bottom,0px) + 14px);
}

/* ---------- 헤더 (비서실과 공통) ---------- */
.top{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:9px 10px;border-radius:16px;
  background:linear-gradient(180deg, rgba(22,30,46,.94), rgba(16,22,34,.94));
  border:1px solid var(--line);
}
.mark{
  flex:0 0 auto;width:40px;height:40px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;font-size:18px;
  background:radial-gradient(circle at 30% 25%, #2a3550, #161e2e);
  border:1px solid rgba(255,194,71,.28);color:var(--acc);
}
.mark svg{width:22px;height:22px}
.brand{flex:1 1 auto;min-width:0}
.brand h1{
  margin:0;font-size:16.5px;line-height:1.2;font-weight:900;
  letter-spacing:-.015em;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.brand p{
  margin:3px 0 0;font-size:9px;font-weight:800;letter-spacing:.055em;color:var(--dim2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.brand p b{color:#e2c98c;font-weight:900}
.tools{flex:0 0 auto;display:flex;align-items:center;gap:6px}
.rbtn{
  flex:0 0 auto;width:34px;height:34px;border-radius:11px;cursor:pointer;text-decoration:none;
  display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1;
  color:var(--txt);background:var(--panel3);border:1px solid var(--line);
  transition:transform .2s, background .2s;font-family:inherit;
}
.rbtn:active{transform:scale(.94);background:#232f47}
.rbtn.nav{background:rgba(111,157,255,.10);border-color:rgba(111,157,255,.30)}
.rbtn.spin{animation:spin .7s linear}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- 당겨서 새로고침 (공통) ---------- */
.ptr{
  position:fixed;left:0;right:0;top:0;z-index:70;pointer-events:none;
  display:flex;align-items:center;justify-content:center;gap:6px;
  height:42px;padding-top:env(safe-area-inset-top,0px);box-sizing:content-box;
  transform:translateY(-110%);transition:transform .18s ease, background .18s ease;
  background:linear-gradient(180deg,rgba(22,30,46,.98),rgba(16,22,34,.96));
  border-bottom:1px solid var(--line);
  font-size:11px;font-weight:900;letter-spacing:.01em;color:#ffd98a;
}
.ptr.on{transform:translateY(0)}
.ptr.ready{background:linear-gradient(180deg,#ffd77a,#ffb928);color:#1c1503;border-bottom-color:rgba(0,0,0,.2)}
.ptr-i{display:block;font-size:14px;line-height:1;transition:transform .2s ease}
.ptr.ready .ptr-i{transform:rotate(180deg)}
body{overscroll-behavior-y:contain}

/* ---------- 게임 목록 ---------- */
.stage{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:12px 0 8px;min-height:0}
.stage>section{flex:0 0 auto;display:flex;flex-direction:column;min-height:0}
.shead{display:flex;align-items:baseline;justify-content:space-between;padding:0 2px 2px}
.shead .lb{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--dim2);text-transform:uppercase}
.shead .cnt{font-size:11px;font-weight:800;color:var(--dim2)}

.cards{flex:0 0 auto;display:flex;flex-direction:column;gap:8px;min-height:0}
.card{
  position:relative;display:flex;align-items:center;gap:12px;
  flex:0 0 auto;min-height:98px;padding:11px 13px 11px 12px;border-radius:16px;
  text-decoration:none;color:inherit;
  background:var(--panel);border:1px solid var(--line);
  transition:background .15s ease,border-color .15s ease;
}
.card:active{background:var(--panel2);border-color:rgba(255,255,255,.2)}
.card:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ic{
  flex:0 0 auto;width:44px;height:44px;border-radius:13px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(var(--ac),.13);border:1px solid rgba(var(--ac),.30);color:rgb(var(--ac));
}
.ic svg{width:24px;height:24px}
.card.c-warm{--ac:232,238,250}
.card.c-cool{--ac:110,160,255}
.card.c-mint{--ac:90,214,178}

.body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px}
.line1{display:flex;align-items:center;gap:7px;min-width:0}
.nm{font-size:16px;font-weight:900;letter-spacing:-.01em;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bdg{
  flex:0 0 auto;font-size:9.5px;font-weight:900;line-height:1;letter-spacing:.02em;
  padding:4px 6px;border-radius:5px;
}
.bdg.new{color:#1a1205;background:var(--acc)}
.bdg.hot{color:#04121f;background:#7fc4ff}
.bdg.cnt{color:#c9d5e8;background:rgba(255,255,255,.09)}
.bdg[hidden]{display:none}
.ds{font-size:12px;line-height:1.35;font-weight:600;color:var(--dim)}
.mt{font-size:10.5px;font-weight:700;color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt .when[hidden]{display:none}
.go{flex:0 0 auto;font-size:19px;font-weight:700;color:var(--dim2);line-height:1}

/* ---------- 하단 ---------- */
.foot{flex:0 0 auto;margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:14px}
.rst{
  -webkit-appearance:none;appearance:none;margin:0;padding:5px 11px;border-radius:8px;
  font-family:inherit;font-size:10.5px;font-weight:700;line-height:1.4;
  color:var(--dim2);background:transparent;border:1px solid var(--line2);
  cursor:pointer;transition:color .15s ease,border-color .15s ease;
}
.rst:active{color:#e6edf9;border-color:var(--line)}
.rst:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.rst.arm{color:#ffd9e2;border-color:rgba(255,120,150,.55);background:rgba(255,120,150,.12)}
.rst.hbtn{color:#cfe0ff;border-color:rgba(122,164,255,.38);background:rgba(122,164,255,.10);font-weight:800}
.rst.hbtn:active{background:rgba(122,164,255,.2);color:#fff}

/* ---------- 경기 기록 모달 ---------- */
.hmodal{
  position:fixed;inset:0;z-index:90;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(5,8,14,.82);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
}
.hmodal.hide{display:none}
.hsheet{
  width:100%;max-width:430px;max-height:80vh;max-height:80dvh;display:flex;flex-direction:column;
  background:#0d121c;border:1px solid rgba(255,255,255,.11);border-bottom:0;
  border-radius:22px 22px 0 0;padding:16px 14px calc(env(safe-area-inset-bottom,0px) + 14px);
  animation:hup .22s ease both;
}
@keyframes hup{from{transform:translateY(16px);opacity:.5}to{transform:none;opacity:1}}
.hhead{display:flex;align-items:flex-start;gap:10px;flex:0 0 auto}
.hhead h2{margin:0;font-size:17px;font-weight:900;letter-spacing:-.01em;color:#fff}
.hhead p{margin:4px 0 0;font-size:10.5px;font-weight:700;color:var(--dim2)}
.hx{
  margin-left:auto;flex:0 0 auto;width:30px;height:30px;border-radius:999px;font-size:12px;font-weight:900;
  color:#cfd9ea;background:rgba(255,255,255,.06);border:1px solid var(--line);line-height:1;
}
.hx:active{background:rgba(255,255,255,.14)}
.hsum{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 0;flex:0 0 auto}
.hsum:empty{display:none}
.hsum .sm{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:800;
  padding:4px 8px;border-radius:8px;color:#cfd9ea;background:rgba(255,255,255,.05);border:1px solid var(--line2);white-space:nowrap}
.hsum .sm b{color:#fff;font-weight:900}
.hsum .sm em{font-style:normal;color:#ffd98a;font-weight:900}
.hsum .sm.hot{color:#ffe0a3;background:rgba(255,194,71,.10);border-color:rgba(255,194,71,.28)}
.htabs{display:flex;gap:5px;margin:12px 0 10px;flex:0 0 auto;padding:4px;border-radius:12px;
  background:rgba(255,255,255,.045);border:1px solid var(--line2)}
.htabs .tab{
  flex:1 1 0;height:32px;border-radius:9px;font-size:12px;font-weight:800;color:#b6c3d8;
  display:flex;align-items:center;justify-content:center;gap:5px;
  background:none;border:0;font-family:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;
}
.htabs .tab.on{background:var(--acc);color:#1a1204}
.htabs .tab b{font-size:10px;font-weight:900;opacity:.75}
.hlist{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;gap:7px;padding-bottom:2px}
.hrow{
  display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:12px;
  background:var(--panel);border:1px solid rgba(255,255,255,.08);flex:0 0 auto;
}
.hres{
  flex:0 0 30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:900;letter-spacing:-.02em;
}
.hres.w{background:rgba(52,211,153,.16);color:#6ee7b7;border:1px solid rgba(52,211,153,.35)}
.hres.l{background:rgba(255,120,150,.14);color:#ff9db8;border:1px solid rgba(255,120,150,.3)}
.hres.d{background:rgba(122,164,255,.14);color:#b6ccff;border:1px solid rgba(122,164,255,.3)}
.hbody{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.h1{display:flex;align-items:center;gap:5px;min-width:0}
.h1 b{font-size:13px;font-weight:900;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hvs{
  flex:0 0 auto;font-size:8.5px;font-weight:900;letter-spacing:.02em;padding:2px 5px;border-radius:5px;
}
.hvs.pvp{color:#8fb4ff;background:rgba(122,164,255,.14);border:1px solid rgba(122,164,255,.3)}
.hvs.ai{color:#ffd88a;background:rgba(255,194,71,.13);border:1px solid rgba(255,194,71,.3)}
.h2{font-size:10.5px;font-weight:700;color:#8c9ab2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ht{flex:0 0 auto;text-align:right;font-size:9.5px;font-weight:800;color:var(--dim2);line-height:1.35;font-variant-numeric:tabular-nums}
.hempty{padding:26px 8px;text-align:center;font-size:12px;font-weight:700;color:var(--dim2);line-height:1.6}
.hempty b{display:block;font-size:22px;margin-bottom:6px}

/* ---------- 넓은 화면 ---------- */
@media (min-width:760px){
  .portal{max-width:860px;padding-top:calc(env(safe-area-inset-top,0px) + 48px);padding-bottom:40px}
  .top{padding:10px 12px}
  .mark{width:44px;height:44px;border-radius:13px;font-size:20px}
  .mark svg{width:24px;height:24px}
  .brand h1{font-size:19px}
  .brand p{font-size:9.5px}
  .rbtn{width:36px;height:36px;font-size:16px}
  .stage{justify-content:flex-start;padding:34px 0 10px;gap:14px}
  .stage>section{flex:0 0 auto}
  .cards{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .card{flex:0 0 auto;min-height:152px;padding:22px 24px;gap:18px;border-radius:20px}
  .card:hover{background:var(--panel2);border-color:rgba(255,255,255,.18)}
  .ic{width:62px;height:62px;border-radius:17px}
  .ic svg{width:33px;height:33px}
  .nm{font-size:18.5px}
  .ds{font-size:13.5px}
  .mt{font-size:12px}
  .go{font-size:22px}
}

@media (max-width:360px){
  .portal{padding-left:13px;padding-right:13px}
  .nm{font-size:14.5px}
  .ds{font-size:11.5px}
  .card{min-height:78px;padding:11px 12px}
  .ic{width:42px;height:42px}
  .ic svg{width:23px;height:23px}
}
@media (max-height:700px) and (max-width:759px){
  .stage{justify-content:flex-start;padding-top:8px}
  .card{min-height:76px;padding:8px 11px}
  .cards{gap:7px}
}
@media (min-height:701px) and (max-height:780px) and (max-width:759px){
  .card{min-height:88px}
  .cards{gap:7px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>

<script>
window.ARC = window.ARC || {
  KEY: 'yg_arcade_stats_v1',
  HKEY: 'yg_arcade_history_v1',
  PKEY: 'yg_arcade_pending_v1',
  DKEY: 'yg_arcade_dev_v1',
  CAP: 200,
  FB: (window.ARC_FB_BASE || 'https://seonongs-hq-default-rtdb.firebaseio.com'),
  _agg: null,
  _opens: null,
  _cloud: false,
  read: function () { try { return JSON.parse(localStorage.getItem(this.KEY) || '{}') || {}; } catch (e) { return {}; } },
  /* 상대 구분: ai(혼자·AI 대전) / pvp(한 기기·온라인 사람 대전) */
  vsOf: function (mode) { return (mode === 'ai' || mode === 'solo' || !mode) ? 'ai' : 'pvp'; },
  dev: function () {
    try {
      var d = localStorage.getItem(this.DKEY);
      if (!d || !/^[a-z0-9]{6,20}$/.test(d)) {
        d = 'd' + Math.random().toString(36).slice(2, 10);
        localStorage.setItem(this.DKEY, d);
      }
      return d;
    } catch (e) { return 'd0'; }
  },
  canCloud: function () {
    try {
      if (/[?&]nofb=1/.test(location.search)) return false;
      return location.protocol === 'http:' || location.protocol === 'https:';
    } catch (e) { return false; }
  },
  _req: function (path, method, body) {
    var opt = { method: method || 'GET', cache: 'no-store' };
    if (body !== undefined) { opt.headers = { 'Content-Type': 'application/json' }; opt.body = JSON.stringify(body); }
    return fetch(this.FB + path, opt).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text().then(function (t) { try { return t ? JSON.parse(t) : null; } catch (e) { return null; } });
    });
  },
  _writeHist: function (arr) { try { localStorage.setItem(this.HKEY, JSON.stringify(arr.slice(0, this.CAP))); } catch (e) {} },
  _pending: function () { try { var a = JSON.parse(localStorage.getItem(this.PKEY) || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; } },
  _queue: function (rec) {
    try {
      var a = this._pending();
      for (var i = 0; i < a.length; i++) if (a[i] && a[i].uid === rec.uid) return;
      a.push(rec);
      localStorage.setItem(this.PKEY, JSON.stringify(a.slice(-60)));
    } catch (e) {}
  },
  _flushPending: function () {
    var self = this, list = this._pending();
    if (!list.length) return Promise.resolve();
    var done = [];
    var chain = Promise.resolve();
    list.forEach(function (rec) {
      chain = chain.then(function () {
        return self._req('/arcade_history/' + rec.uid + '.json', 'PUT', rec).then(function () { done.push(rec.uid); }, function () { throw 0; });
      });
    });
    return chain.catch(function () {}).then(function () {
      if (!done.length) return;
      try {
        localStorage.setItem(self.PKEY, JSON.stringify(self._pending().filter(function (r) { return done.join(' ').indexOf(r.uid) < 0; })));
      } catch (e) {}
    });
  },
  record: function (id, res, vs) {
    try {
      var all = this.read(), s = all[id] || {};
      s.wins = Math.max(0, +s.wins || 0);
      s.losses = Math.max(0, +s.losses || 0);
      s.draws = Math.max(0, +s.draws || 0);
      if (res === 'win') s.wins++; else if (res === 'lose') s.losses++; else s.draws++;
      var k = (vs === 'ai') ? 'ai' : ((vs === 'pvp') ? 'pvp' : this.vsOf(''));
      var g = s[k] || {};
      g.wins = Math.max(0, +g.wins || 0);
      g.losses = Math.max(0, +g.losses || 0);
      g.draws = Math.max(0, +g.draws || 0);
      if (res === 'win') g.wins++; else if (res === 'lose') g.losses++; else g.draws++;
      s[k] = g;
      s.played = s.wins + s.losses + s.draws;
      s.lastResult = res;
      s.lastPlayed = Date.now();
      all[id] = s;
      localStorage.setItem(this.KEY, JSON.stringify(all));
    } catch (e) {}
  },
  part: function (g) {
    if (!g) return '';
    var w = Math.max(0, +g.wins || 0), l = Math.max(0, +g.losses || 0), d = Math.max(0, +g.draws || 0);
    if (!w && !l && !d) return '';
    return w + '승 ' + l + '패' + (d ? ' ' + d + '무' : '');
  },
  _mx: function (a, b) { return Math.max(+a || 0, +b || 0); },
  _grp: function (a, b) {
    if (!a && !b) return undefined;
    a = a || {}; b = b || {};
    return { wins: this._mx(a.wins, b.wins), losses: this._mx(a.losses, b.losses), draws: this._mx(a.draws, b.draws) };
  },
  /* 로컬 전적 + 클라우드 집계(최댓값 병합 — 중복 없이 합산) */
  statOf: function (id) {
    var a = this.read()[id] || {};
    var b = (this._agg && this._agg.games && this._agg.games[id]) || {};
    var o = {
      wins: this._mx(a.wins, b.wins),
      losses: this._mx(a.losses, b.losses),
      draws: this._mx(a.draws, b.draws)
    };
    var p = this._grp(a.pvp, b.pvp), q = this._grp(a.ai, b.ai);
    if (p) o.pvp = p;
    if (q) o.ai = q;
    return o;
  },
  line: function (id) {
    var s = this.statOf(id);
    var w = s.wins, l = s.losses, d = s.draws;
    if (!w && !l && !d) return '';
    var tot = '통산 ' + w + '승 ' + l + '패' + (d ? ' ' + d + '무' : '');
    var pv = this.part(s.pvp), ai = this.part(s.ai);
    var parts = [];
    if (pv) parts.push('사람 ' + pv);
    if (ai) parts.push('AI ' + ai);
    if (!parts.length) return tot;
    var sum = (s.pvp ? s.pvp.wins + s.pvp.losses + s.pvp.draws : 0) + (s.ai ? s.ai.wins + s.ai.losses + s.ai.draws : 0);
    if (parts.length === 1 && (w + l + d) === sum) return tot + ' · ' + parts[0];
    return tot + ' · ' + parts.join(' · ');
  },
  show: function (id, modal) {
    var root = typeof modal === 'string' ? document.querySelector(modal) : modal;
    if (!root) return;
    var box = root.querySelector('.modal') || root.querySelector('.card') || root;
    var txt = this.line(id);
    var el = box.querySelector('.res-stat');
    if (!txt) { if (el) el.remove(); return; }
    if (!el) {
      el = document.createElement('div');
      el.className = 'res-stat';
      el.innerHTML = '<span>내 전적</span><b></b>';
      var foot = box.querySelector('.mrow, .endact, .rules-close');
      if (foot && foot.parentNode === box) box.insertBefore(el, foot); else box.appendChild(el);
    }
    el.querySelector('b').textContent = txt;
  },
  norm: function (v, key) {
    if (!v || typeof v !== 'object') return null;
    var at = +v.playedAt || 0;
    if (!at) return null;
    var r = String(v.result || 'draw');
    if (r === 'lose') r = 'loss';
    if (r !== 'win' && r !== 'loss' && r !== 'draw') r = 'draw';
    return {
      uid: String(v.uid || key || ('h' + at + '-' + String(v.id || v.game || ''))),
      id: String(v.id || v.game || ''),
      game: String(v.game || v.title || v.id || ''),
      mode: String(v.mode || ''),
      vs: (v.vs === 'ai') ? 'ai' : 'pvp',
      myName: String(v.myName || ''),
      oppName: String(v.oppName || ''),
      result: r,
      scoreText: String(v.scoreText || ''),
      playedAt: at
    };
  },
  history: function () {
    try {
      var a = JSON.parse(localStorage.getItem(this.HKEY) || '[]');
      if (!Array.isArray(a)) return [];
      var self = this, out = [];
      a.forEach(function (x) { var r = self.norm(x); if (r) out.push(r); });
      return out;
    } catch (e) { return []; }
  },
  /* 경기 히스토리 — 최신순 최대 200건, 로컬 + Firebase 동시 저장 */
  save: function (o) {
    var rec = null;
    try {
      o = o || {};
      var arr = this.history();
      var r = o.result;
      if (r === 'lose') r = 'loss';
      if (r !== 'win' && r !== 'loss' && r !== 'draw') r = 'draw';
      var mode = String(o.mode || '');
      rec = {
        uid: 'h' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        id: String(o.game || ''),
        game: String(o.title || o.game || ''),
        mode: mode,
        vs: (o.vs === 'ai' || o.vs === 'pvp') ? o.vs : this.vsOf(mode),
        myName: String(o.myName || ''),
        oppName: String(o.oppName || ''),
        result: r,
        scoreText: String(o.scoreText || ''),
        playedAt: Date.now(),
        dev: this.dev()
      };
      arr.unshift(rec);
      if (arr.length > this.CAP) arr.length = this.CAP;
      this._writeHist(arr);
    } catch (e) { return; }
    if (!this.canCloud()) return;
    var self = this;
    this._req('/arcade_history/' + rec.uid + '.json', 'PUT', rec)
      .then(function () { self._cloud = true; return self._pushStats(); })
      .catch(function () { self._queue(rec); });
  },
  derive: function (list) {
    var games = {}, players = {};
    list.forEach(function (r) {
      var g = games[r.id] || (games[r.id] = { wins: 0, losses: 0, draws: 0, plays: 0, pvp: { wins: 0, losses: 0, draws: 0 }, ai: { wins: 0, losses: 0, draws: 0 } });
      var k = (r.result === 'win') ? 'wins' : (r.result === 'loss' ? 'losses' : 'draws');
      g[k]++; g.plays++;
      g[r.vs][k]++;
      var nm = r.myName || '';
      if (nm) {
        var p = players[nm] || (players[nm] = { wins: 0, losses: 0, draws: 0, plays: 0 });
        p[k]++; p.plays++;
      }
    });
    /* 연승 — 플레이어별 최근 결과 연속 수 */
    var streak = {};
    var byName = {};
    list.forEach(function (r) { if (r.myName) (byName[r.myName] = byName[r.myName] || []).push(r); });
    Object.keys(byName).forEach(function (nm) {
      var arr = byName[nm].slice().sort(function (a, b) { return b.playedAt - a.playedAt; });
      var res = arr[0] ? arr[0].result : '';
      var n = 0;
      for (var i = 0; i < arr.length && arr[i].result === res; i++) n++;
      streak[nm] = { result: res, n: n };
    });
    Object.keys(players).forEach(function (nm) { players[nm].streak = streak[nm] || null; });
    return { games: games, players: players, streak: streak };
  },
  _pushStats: function () {
    if (!this.canCloud() || !this._agg) return Promise.resolve();
    var self = this;
    return this._req('/arcade_stats/games.json', 'PUT', this._agg.games)
      .then(function () { return self._req('/arcade_stats/players.json', 'PUT', self._agg.players); })
      .then(function () { return self._req('/arcade_stats/updatedAt.json', 'PUT', Date.now()); })
      .catch(function () {});
  },
  open: function (id, clicks, lastOpened) {
    if (!this.canCloud()) return;
    var rec = { clicks: Math.max(0, +clicks || 0), lastOpened: +lastOpened || Date.now() };
    this._req('/arcade_stats/opens/' + this.dev() + '/' + id + '.json', 'PUT', rec).catch(function () {});
    if (this._opens) { var d = this.dev(); this._opens[d] = this._opens[d] || {}; this._opens[d][id] = rec.clicks; }
  },
  opensOf: function (id) {
    var all = this._opens || {}, n = 0;
    Object.keys(all).forEach(function (dev) {
      var g = all[dev];
      if (g && typeof g === 'object') n += Math.max(0, +g[id] || 0);
    });
    return n;
  },
  sync: function () {
    if (!this.canCloud()) return Promise.resolve();
    var self = this;
    return Promise.all([
      this._req('/arcade_history.json?t=' + Date.now()).catch(function () { return undefined; }),
      this._req('/arcade_stats.json?t=' + Date.now()).catch(function () { return undefined; })
    ]).then(function (res) {
      var reachable = (res[0] !== undefined) || (res[1] !== undefined);
      var hraw = (res[0] === undefined) ? null : res[0];
      var sraw = (res[1] === undefined) ? null : res[1];
      var cloud = [], map = (hraw && typeof hraw === 'object') ? hraw : {};
      Object.keys(map).forEach(function (k) {
        var r = self.norm(map[k], k);
        if (r) cloud.push(r);
      });
      var seen = {}, merged = [];
      cloud.concat(self.history()).forEach(function (r) {
        if (seen[r.uid]) return;
        seen[r.uid] = 1;
        merged.push(r);
      });
      merged.sort(function (a, b) { return b.playedAt - a.playedAt; });
      if (merged.length > self.CAP) merged.length = self.CAP;
      self._writeHist(merged);

      var agg = self.derive(merged);
      var sg = (sraw && sraw.games) || null;
      if (sg) {
        Object.keys(sg).forEach(function (id) {
          var a = agg.games[id] || { wins: 0, losses: 0, draws: 0, plays: 0, pvp: { wins: 0, losses: 0, draws: 0 }, ai: { wins: 0, losses: 0, draws: 0 } };
          var b = sg[id] || {};
          agg.games[id] = {
            wins: self._mx(a.wins, b.wins), losses: self._mx(a.losses, b.losses), draws: self._mx(a.draws, b.draws),
            plays: self._mx(a.plays, b.plays),
            pvp: self._grp(a.pvp, b.pvp) || { wins: 0, losses: 0, draws: 0 },
            ai: self._grp(a.ai, b.ai) || { wins: 0, losses: 0, draws: 0 }
          };
        });
      }
      self._agg = agg;
      self._opens = (sraw && sraw.opens) || {};
      self._cloud = reachable;

      var have = {};
      cloud.forEach(function (r) { have[r.uid] = 1; });
      merged.forEach(function (r) { if (!have[r.uid]) self._queue(r); });
      self._flushPending();
      if (hraw) self._pushStats();
      if (typeof window.ARC_ON_SYNC === 'function') { try { window.ARC_ON_SYNC(agg, merged); } catch (e) {} }
    }).catch(function () {});
  },
  clearHistory: function () { try { localStorage.removeItem(this.HKEY); } catch (e) {} try { localStorage.removeItem(this.PKEY); } catch (e) {} },
  clearCloud: function () {
    var self = this;
    if (!this.canCloud()) return Promise.resolve();
    return this._req('/arcade_history.json', 'DELETE')
      .then(function () { return self._req('/arcade_stats/games.json', 'PUT', {}); })
      .then(function () { return self._req('/arcade_stats/players.json', 'PUT', {}); })
      .then(function () { return self._req('/arcade_stats/opens.json', 'DELETE'); })
      .catch(function () {});
  }
};
(function () {
  function boot() { try { window.ARC.sync(); } catch (e) {} }
  if (document.readyState === 'complete' || document.readyState === 'interactive') setTimeout(boot, 40);
  else document.addEventListener('DOMContentLoaded', function () { setTimeout(boot, 40); });
  window.addEventListener('pageshow', boot);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) boot(); });
})();
</script>

<script>
/* ============================================================
   아케이드 이용 기록 · 동적 배지 시스템 (localStorage)
   저장 키: yg_arcade_stats_v1
   { "wall-baduk2": {clicks: 3, lastOpened: 1763....} , ... }
   ============================================================ */
(function () {
  "use strict";
  var KEY = "yg_arcade_stats_v1";
  var cards = Array.prototype.slice.call(document.querySelectorAll(".card[data-app-id]"));
  if (!cards.length) return;

  var ids = [];
  var byId = {};
  cards.forEach(function (card) {
    var id = card.getAttribute("data-app-id");
    ids.push(id);
    byId[id] = card;
  });

  var pillTxt = document.getElementById("statPillTxt");
  var resetBtn = document.getElementById("resetStats");

  function readStats() {
    var out = {};
    var raw = null;
    try { raw = window.localStorage.getItem(KEY); } catch (e) { raw = null; }
    var data = {};
    if (raw) { try { data = JSON.parse(raw); } catch (e) { data = {}; } }
    if (!data || typeof data !== "object") data = {};
    ids.forEach(function (id) {
      var s = data[id];
      if (!s || typeof s !== "object") return;
      var clicks = Math.floor(Number(s.clicks));
      var last = Number(s.lastOpened);
      if (!isFinite(clicks) || clicks < 0) clicks = 0;
      if (!isFinite(last) || last <= 0) last = 0;
      if (clicks > 0 || last > 0) {
        out[id] = { clicks: clicks, lastOpened: last,
          wins: Math.max(0, Math.floor(Number(s.wins) || 0)),
          losses: Math.max(0, Math.floor(Number(s.losses) || 0)),
          draws: Math.max(0, Math.floor(Number(s.draws) || 0)),
          pvp: grp(s.pvp), ai: grp(s.ai) };
      }
    });
    mergeCloud(out);
    return out;
  }

  /* Firebase 집계와 큰 값을 골라 합치기 — 기기를 바꾸거나 캐시가 날아가도 부부 통합 전적 유지 */
  function mergeCloud(out) {
    var agg = (window.ARC && window.ARC._agg) || null;
    ids.forEach(function (id) {
      var c = agg && agg.games && agg.games[id];
      var opens = (window.ARC && window.ARC.opensOf) ? window.ARC.opensOf(id) : 0;
      if (!c && !opens) return;
      var s = out[id] || { clicks: 0, lastOpened: 0, wins: 0, losses: 0, draws: 0 };
      if (opens > s.clicks) s.clicks = opens;
      if (c) {
        s.wins = Math.max(s.wins, Math.floor(Number(c.wins) || 0));
        s.losses = Math.max(s.losses, Math.floor(Number(c.losses) || 0));
        s.draws = Math.max(s.draws, Math.floor(Number(c.draws) || 0));
        s.pvp = maxGrp(s.pvp, c.pvp);
        s.ai = maxGrp(s.ai, c.ai);
      }
      if (s.clicks > 0 || s.wins + s.losses + s.draws > 0) out[id] = s;
    });
  }

  function maxGrp(a, b) {
    if (!a && !b) return null;
    a = a || { wins: 0, losses: 0, draws: 0 };
    b = b || { wins: 0, losses: 0, draws: 0 };
    var o = { wins: Math.max(a.wins || 0, b.wins || 0),
      losses: Math.max(a.losses || 0, b.losses || 0),
      draws: Math.max(a.draws || 0, b.draws || 0) };
    return (o.wins || o.losses || o.draws) ? o : null;
  }

  function grp(g) {
    if (!g || typeof g !== "object") return null;
    var w = Math.max(0, Math.floor(Number(g.wins) || 0));
    var l = Math.max(0, Math.floor(Number(g.losses) || 0));
    var d = Math.max(0, Math.floor(Number(g.draws) || 0));
    if (!w && !l && !d) return null;
    return { wins: w, losses: l, draws: d };
  }

  function partOf(g) {
    if (!g) return "";
    return g.wins + "승 " + g.losses + "패" + (g.draws ? " " + g.draws + "무" : "");
  }

  /* 카드 전적 — AI 대전과 사람 대전을 구분해서 보여준다 */
  function recOf(s) {
    var seg = [];
    var pv = partOf(s.pvp), ai = partOf(s.ai);
    if (pv) seg.push("사람 " + pv);
    if (ai) seg.push("AI " + ai);
    if (seg.length) return seg.join(" · ") + " · ";
    var w = s.wins || 0, l = s.losses || 0, d = s.draws || 0;
    if (!w && !l && !d) return "";
    return w + "승 " + l + "패" + (d ? " " + d + "무" : "") + " · ";
  }

  function writeStats(all) {
    try { window.localStorage.setItem(KEY, JSON.stringify(all)); } catch (e) { /* 사생활 보호 모드 등 */ }
  }

  function clearStats() {
    try { window.localStorage.removeItem(KEY); } catch (e) { /* noop */ }
  }

  function releasedOf(card) {
    var t = Date.parse((card.getAttribute("data-released") || "") + "T00:00:00");
    return isFinite(t) ? t : 0;
  }

  function favoriteOf(stats) {
    var best = null;
    ids.forEach(function (id) {
      var s = stats[id];
      if (!s || s.clicks < 1) return;
      if (!best) { best = id; return; }
      var b = stats[best];
      if (s.clicks !== b.clicks) { if (s.clicks > b.clicks) best = id; return; }
      if (s.lastOpened !== b.lastOpened) { if (s.lastOpened > b.lastOpened) best = id; return; }
      if (releasedOf(byId[id]) > releasedOf(byId[best])) best = id;
    });
    return best;
  }

  function pad2(n) { return (n < 10 ? "0" : "") + n; }

  function fullTime(ts) {
    if (!ts) return "";
    var d = new Date(ts);
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()) +
      " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  }

  function ago(ts) {
    if (!ts) return "";
    var now = Date.now();
    var diff = now - ts;
    if (diff < 0) diff = 0;
    if (diff < 60000) return "방금 전";
    if (diff < 3600000) return Math.floor(diff / 60000) + "분 전";
    var a = new Date(ts), b = new Date(now);
    var da = new Date(a.getFullYear(), a.getMonth(), a.getDate()).getTime();
    var db = new Date(b.getFullYear(), b.getMonth(), b.getDate()).getTime();
    var days = Math.round((db - da) / 86400000);
    if (days <= 0) return "오늘";
    if (days < 30) return days + "일 전";
    return "오래 전";
  }

  function render() {
    var stats = readStats();
    var fav = favoriteOf(stats);
    var total = 0;

    cards.forEach(function (card) {
      var id = card.getAttribute("data-app-id");
      var s = stats[id] || { clicks: 0, lastOpened: 0 };
      var plays = (s.wins || 0) + (s.losses || 0) + (s.draws || 0);
      total += s.clicks;

      var badge = card.querySelector('[data-slot="badge"]');
      var when = card.querySelector('[data-slot="when"]');
      var cls, text;
      if (s.clicks < 1 && plays < 1) {
        cls = "bdg new";
        text = "NEW";
      } else if (id === fav) {
        cls = "bdg hot";
        text = "최다 · " + s.clicks + "회";
      } else if (s.clicks > 0) {
        cls = "bdg cnt";
        text = s.clicks + "회";
      } else {
        cls = "bdg cnt";
        text = plays + "판";
      }
      if (badge) {
        if (badge.textContent !== text) badge.textContent = text;
        if (badge.className !== cls) badge.className = cls;
        badge.hidden = false;
      }

      if (when) {
        var rec = recOf(s);
        var tail = s.lastOpened ? ("최근 " + (ago(s.lastOpened) || "오늘")) : "";
        var label = (rec + tail).replace(/\s*·\s*$/, "").trim();
        if (label) {
          if (when.textContent !== label) when.textContent = label;
          when.title = (s.lastOpened ? "마지막 실행 " + fullTime(s.lastOpened) : "부부 통합 전적");
          when.hidden = false;
        } else {
          when.hidden = true;
          when.textContent = "";
          when.title = "출시 " + (card.getAttribute("data-released") || "-") + " · 아직 실행 안 함";
        }
      }
      card.setAttribute("data-clicks", String(s.clicks));
    });

    if (pillTxt) pillTxt.textContent = total > 0 ? "총 " + total + "회" : "READY";
  }

  function bump(id) {
    var raw = {};
    try { raw = JSON.parse(window.localStorage.getItem(KEY) || "{}") || {}; } catch (e) { raw = {}; }
    var s = raw[id] || { clicks: 0, lastOpened: 0 };
    s.clicks = Math.max(0, Math.floor(Number(s.clicks) || 0)) + 1;
    s.lastOpened = Date.now();
    raw[id] = s;
    writeStats(raw);
    if (window.ARC && ARC.open) ARC.open(id, s.clicks, s.lastOpened);
    render();
  }

  cards.forEach(function (card) {
    var id = card.getAttribute("data-app-id");
    card.addEventListener("click", function () { bump(id); }, true);
    card.addEventListener("auxclick", function (ev) { if (ev.button === 1) bump(id); });
  });

  window.addEventListener("pageshow", render);
  window.addEventListener("focus", render);
  window.addEventListener("arcade-sync", render);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) render(); });
  window.addEventListener("storage", function (ev) { if (!ev.key || ev.key === KEY) render(); });
  setInterval(function () { if (!document.hidden) render(); }, 30000);

  var armed = false, armTimer = 0;
  function disarm() {
    armed = false;
    if (armTimer) { clearTimeout(armTimer); armTimer = 0; }
    if (resetBtn) {
      resetBtn.textContent = "기록 초기화";
      resetBtn.classList.remove("arm");
      resetBtn.setAttribute("aria-pressed", "false");
    }
  }
  if (resetBtn) {
    resetBtn.addEventListener("click", function () {
      if (!armed) {
        armed = true;
        resetBtn.textContent = "한 번 더 누르면 지워요";
        resetBtn.title = "부부 통합 기록(양쪽 폰)까지 함께 지웁니다";
        resetBtn.classList.add("arm");
        resetBtn.setAttribute("aria-pressed", "true");
        armTimer = setTimeout(disarm, 3500);
        return;
      }
      disarm();
      clearStats();
      try { window.localStorage.removeItem("yg_arcade_history_v1"); } catch (e) { /* noop */ }
      if (window.ARC) {
        try { ARC.clearHistory(); } catch (e) { /* noop */ }
        try { ARC.clearCloud(); } catch (e) { /* noop */ }
      }
      render();
      try { window.HIST && window.HIST.render(); } catch (e) { /* noop */ }
      if (pillTxt) pillTxt.textContent = "READY";
    });
  }

  render();
})();
</script>

<script>
/* ============================================================
   경기 기록 모달 (yg_arcade_history_v1)
   ============================================================ */
(function () {
  "use strict";
  var KEY = "yg_arcade_history_v1";
  var modal = document.getElementById("histModal");
  var list = document.getElementById("histList");
  var tabs = document.getElementById("histTabs");
  var btn = document.getElementById("histBtn");
  var closeBtn = document.getElementById("histClose");
  if (!modal || !list || !tabs || !btn) return;

  var filter = "all";
  var RES = { win: ["w", "승"], loss: ["l", "패"], draw: ["d", "무"] };
  var VS = { pvp: "사람", ai: "AI" };

  function read() {
    try {
      var a = JSON.parse(window.localStorage.getItem(KEY) || "[]");
      return Array.isArray(a) ? a : [];
    } catch (e) { return []; }
  }
  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  function dayOf(ts) { var d = new Date(ts); return pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
  function timeOf(ts) { var d = new Date(ts); return pad2(d.getHours()) + ":" + pad2(d.getMinutes()); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function renderSum(all) {
    var sub = document.getElementById("histSub");
    var cloud = !!(window.ARC && window.ARC._cloud);
    if (sub) sub.textContent = (cloud ? "부부 통합 전적 · Firebase 동기화" : "이 기기에만 저장") + " · " + all.length + "경기";
    var sum = document.getElementById("histSum");
    if (!sum) return;
    var pv = { w: 0, l: 0, d: 0 }, ai = { w: 0, l: 0, d: 0 };
    all.forEach(function (e) {
      var g = ((e && e.vs === "ai") ? ai : pv);
      var r = e && e.result;
      if (r === "win") g.w++; else if (r === "loss" || r === "lose") g.l++; else g.d++;
    });
    var html = "";
    if (pv.w + pv.l + pv.d) html += '<span class="sm">사람 <b>' + pv.w + "승 " + pv.l + "패</b>" + (pv.d ? " " + pv.d + "무" : "") + '</span>';
    if (ai.w + ai.l + ai.d) html += '<span class="sm">AI <b>' + ai.w + "승 " + ai.l + "패</b>" + (ai.d ? " " + ai.d + "무" : "") + '</span>';
    var players = (window.ARC && window.ARC._agg && window.ARC._agg.players) || null;
    if (players) {
      var names = Object.keys(players).sort(function (a, b) { return (players[b].plays || 0) - (players[a].plays || 0); }).slice(0, 2);
      names.forEach(function (nm) {
        var p = players[nm] || {};
        var st = p.streak || null;
        var hot = !!(st && st.result === "win" && st.n >= 2);
        var stx = (st && st.n >= 2)
          ? '<em>' + (st.result === "win" ? "🔥" : "") + st.n + (st.result === "win" ? "연승" : (st.result === "loss" ? "연패" : "연무")) + '</em>'
          : "";
        html += '<span class="sm' + (hot ? " hot" : "") + '"><b>' + esc(nm) + '</b> ' + (p.wins || 0) + "승 " + (p.losses || 0) + "패 " + stx + '</span>';
      });
    }
    sum.innerHTML = html;
  }

  function render() {
    var all = read();
    renderSum(all);
    var cnt = { all: all.length, pvp: 0, ai: 0 };
    all.forEach(function (e) { cnt[(e && e.vs === "ai") ? "ai" : "pvp"] += 1; });

    Array.prototype.forEach.call(tabs.querySelectorAll(".tab"), function (t) {
      var v = t.getAttribute("data-v");
      var on = (v === filter);
      t.classList.toggle("on", on);
      t.setAttribute("aria-selected", on ? "true" : "false");
      var b = t.querySelector("b");
      if (b) b.textContent = cnt[v] || 0;
    });

    var rows = all.filter(function (e) {
      if (filter === "all") return true;
      return ((e && e.vs === "ai") ? "ai" : "pvp") === filter;
    });

    if (!rows.length) {
      list.innerHTML = '<div class="hempty"><b>📜</b>' +
        (all.length ? "이 조건의 경기가 없습니다." : "아직 경기 기록이 없습니다.<br>게임을 한 판 끝내면 여기에 쌓입니다.") +
        "</div>";
      return;
    }

    var h = "";
    rows.forEach(function (e) {
      var r = RES[e.result] || RES.draw;
      var vs = (e.vs === "ai") ? "ai" : "pvp";
      var line = [];
      if (e.myName) line.push(String(e.myName) + (e.oppName ? " vs " + String(e.oppName) : ""));
      if (e.scoreText) line.push(String(e.scoreText));
      h += '<div class="hrow">' +
        '<span class="hres ' + r[0] + '">' + r[1] + "</span>" +
        '<span class="hbody"><span class="h1"><b>' + esc(e.game || e.id || "게임") + "</b>" +
        '<span class="hvs ' + vs + '">' + VS[vs] + "</span></span>" +
        '<span class="h2">' + esc(line.join(" · ")) + "</span></span>" +
        '<span class="ht">' + dayOf(e.playedAt) + "<br>" + timeOf(e.playedAt) + "</span>" +
        "</div>";
    });
    list.innerHTML = h;
  }

  function open() { modal.classList.remove("hide"); render(); }
  function close() { modal.classList.add("hide"); }

  btn.addEventListener("click", open);
  if (closeBtn) closeBtn.addEventListener("click", close);
  modal.addEventListener("click", function (e) { if (e.target === modal) close(); });
  tabs.addEventListener("click", function (e) {
    var t = e.target && e.target.closest ? e.target.closest(".tab") : null;
    if (!t) return;
    filter = t.getAttribute("data-v") || "all";
    render();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !modal.classList.contains("hide")) close();
  });

  window.HIST = { render: render, open: open, close: close };
  window.addEventListener("arcade-sync", render);
  render();
})();
</script>

<script>
/* ============================================================
   새로고침 · 당겨서 새로고침 (iOS 홈화면 웹앱)
   ============================================================ */
(function () {
  "use strict";
  function targetUrl() {
    var u = location.pathname + location.search;
    u = u.replace(/([?&])v=\d+/g, function (t, s) { return s === "?" ? "?" : ""; });
    u = u.replace(/\?&/, "?").replace(/[?&]$/, "");
    return u + (u.indexOf("?") >= 0 ? "&" : "?") + "v=" + Date.now();
  }
  window.ARC_ON_SYNC = function () { try { window.dispatchEvent(new Event("arcade-sync")); } catch (e) {} };

  var rf = document.getElementById("refreshBtn");
  if (rf) rf.addEventListener("click", function () {
    rf.classList.remove("spin");
    void rf.offsetWidth;
    rf.classList.add("spin");
    if (window.ARC && ARC.sync) ARC.sync();
    try { window.dispatchEvent(new Event("arcade-sync")); } catch (e) {}
    setTimeout(function () {
      if (window.__PTR_TEST__) { window.__PTR_LAST__ = targetUrl(); return; }
      location.replace(targetUrl());
    }, 260);
  });

  var bar = document.getElementById("ptr");
  if (!bar) return;
  var sy = 0, sx = 0, dy = 0, active = false, ready = false;
  var TH = 70;
  function topY() {
    return window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
  }
  function clear() { bar.classList.remove("on", "ready"); ready = false; }
  document.addEventListener("touchstart", function (e) {
    if (e.touches.length !== 1 || topY() > 0) { active = false; return; }
    active = true; ready = false;
    sy = e.touches[0].clientY; sx = e.touches[0].clientX;
  }, { passive: true });
  document.addEventListener("touchmove", function (e) {
    if (!active || e.touches.length !== 1) return;
    dy = e.touches[0].clientY - sy;
    var dx = e.touches[0].clientX - sx;
    if (topY() > 0) { active = false; clear(); return; }
    if (dy <= 0 || Math.abs(dy) <= Math.abs(dx)) { clear(); return; }
    bar.classList.add("on");
    ready = dy >= TH;
    bar.classList.toggle("ready", ready);
    var t = bar.querySelector(".ptr-t");
    if (t) t.textContent = ready ? "놓으면 최신 버전으로 새로고침" : "아래로 당기세요";
  }, { passive: true });
  document.addEventListener("touchend", function () {
    if (!active) return;
    var go = ready && dy >= TH;
    active = false; ready = false;
    if (!go) { clear(); return; }
    var t = bar.querySelector(".ptr-t");
    if (t) t.textContent = "새로고침 중…";
    bar.classList.add("on", "ready");
    if (window.__PTR_TEST__) { window.__PTR_LAST__ = targetUrl(); return; }
    location.replace(targetUrl());
  }, { passive: true });
  document.addEventListener("touchcancel", function () { active = false; clear(); }, { passive: true });
  window.PTR = { target: targetUrl, isReady: function () { return ready; } };
})();
</script>
