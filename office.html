<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="비서실">
<meta name="description" content="비서실 · 행동대장 HQ. 집무실·자동화 작업실·라운지 실시간 현황판과 최저가 시세판.">
<title>비서실 · 행동대장 HQ</title>
<link rel="apple-touch-icon" sizes="180x180" href="./office-icon.png">
<link rel="icon" type="image/png" sizes="180x180" href="./office-icon.png">
<style>
:root{
  --bg:#0a0d14; --panel:#121826; --panel2:#161e2e; --panel3:#1b2438;
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.06);
  --txt:#f3f6fc; --dim:#98a6bf; --dim2:#7c8aa2;
  --acc:#ffc247; --acc2:#6f9dff; --ok:#34d399; --warn:#ff9f6b;
  --beige:#e8dcc4;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Pretendard",system-ui,sans-serif;
  font-size:15px;line-height:1.45;
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
  word-break:keep-all;overflow-wrap:break-word;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(120% 60% at 50% -10%, #182338 0%, rgba(10,13,20,0) 62%),
    radial-gradient(80% 50% at 100% 100%, rgba(255,194,71,.06) 0%, rgba(10,13,20,0) 70%);
}
.wrap{
  position:relative;z-index:1;
  width:100%;max-width:960px;margin:0 auto;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 22px);
}

/* ---------- 상단 바 ---------- */
.top{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;border-radius:var(--r);
  background:linear-gradient(180deg, rgba(22,30,46,.94), rgba(16,22,34,.94));
  border:1px solid var(--line);
}
.mark{
  flex:0 0 auto;width:40px;height:40px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;font-size:20px;
  background:radial-gradient(circle at 30% 25%, #2a3550, #161e2e);
  border:1px solid rgba(255,194,71,.28);
}
.brand{flex:1 1 auto;min-width:0}
.brand h1{
  margin:0;font-size:16.5px;line-height:1.2;font-weight:900;letter-spacing:-.015em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.brand p{
  margin:3px 0 0;font-size:9px;font-weight:800;letter-spacing:.055em;color:var(--dim2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.brand p b{color:#e2c98c;font-weight:900}
.tools{flex:0 0 auto;display:flex;align-items:center;gap:6px}
.rbtn{
  flex:0 0 auto;width:34px;height:34px;border-radius:11px;cursor:pointer;text-decoration:none;
  display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1;
  color:var(--txt);background:var(--panel3);border:1px solid var(--line);
  transition:transform .2s, background .2s;
}
.rbtn:active{transform:scale(.94);background:#232f47}
.rbtn.spin{animation:spin .7s linear}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- 섹션 공통 ---------- */
.sec{margin-top:12px}
.sec-h{display:flex;align-items:center;gap:8px;margin:0 2px 7px;min-width:0}
.sec-h h2{margin:0;font-size:12.5px;font-weight:900;letter-spacing:.01em;color:#e8eefb;white-space:nowrap}
.sec-h .k{font-size:9px;font-weight:900;letter-spacing:.13em;color:var(--dim2);white-space:nowrap}
.sec-h .sp{flex:1 1 auto;min-width:0}
.card{
  background:linear-gradient(180deg,#141b2a,#101623);
  border:1px solid var(--line);border-radius:var(--r);
}
.live{
  display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;
  font-size:9px;font-weight:900;letter-spacing:.08em;color:#cfe6da;
  background:rgba(52,211,153,.10);border:1px solid rgba(52,211,153,.30);white-space:nowrap;
}
.live i{width:6px;height:6px;border-radius:50%;background:var(--ok);display:block;animation:pulse 2.4s ease-in-out infinite}
.live.off{color:#f3d2c2;background:rgba(255,159,107,.10);border-color:rgba(255,159,107,.30)}
.live.off i{background:var(--warn);animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ---------- 오피스 맵 ---------- */
.map-card{padding:9px;position:relative;overflow:hidden}
.map-card::before{
  content:"";position:absolute;inset:0;pointer-events:none;border-radius:var(--r);
  background-image:
    linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
  background-size:22px 22px;opacity:.6;
}
.map{
  position:relative;
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr .9fr;
  gap:7px;height:360px;
}
.room{
  position:relative;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;
  width:100%;height:100%;text-align:left;
  padding:9px 9px 8px;border-radius:12px;cursor:pointer;
  color:var(--txt);font:inherit;
  background:linear-gradient(180deg, rgba(30,40,60,.92), rgba(20,27,41,.92));
  border:1px solid rgba(255,255,255,.085);
  overflow:hidden;
  transition:transform .18s ease, border-color .22s, box-shadow .22s, background .22s;
}
.room:hover{border-color:rgba(255,255,255,.18)}
.room:active{transform:scale(.985)}
.room::after{content:"";position:absolute;left:0;right:0;bottom:0;height:44%;pointer-events:none;z-index:0;
  background:linear-gradient(180deg, rgba(120,160,255,0) 0%, rgba(120,160,255,.05) 100%)}
.room.on::after{background:linear-gradient(180deg, rgba(255,194,71,0) 0%, rgba(255,194,71,.07) 100%)}
.room .rh{display:flex;align-items:center;gap:5px;min-width:0;position:relative;z-index:2}
.room .ico{flex:0 0 auto;font-size:14px;line-height:1}
.room .nm{flex:1 1 auto;min-width:0;font-size:11.5px;font-weight:900;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room .sub{margin:4px 0 0;font-size:9.5px;line-height:1.35;color:#8e9db6;position:relative;z-index:2;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.room .st{
  position:absolute;left:8px;bottom:7px;z-index:2;display:inline-flex;align-items:center;gap:4px;
  font-size:8.5px;font-weight:900;letter-spacing:.03em;color:#c2cee1;
  padding:2px 6px;border-radius:999px;background:rgba(8,12,20,.55);border:1px solid var(--line2);
  max-width:calc(100% - 16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.room .st em{font-style:normal;width:5px;height:5px;border-radius:50%;background:var(--acc);display:block;flex:0 0 auto}
.room.on{
  border-color:rgba(255,194,71,.55);
  background:linear-gradient(180deg, rgba(48,58,82,.96), rgba(26,34,50,.96));
  box-shadow:0 0 0 1px rgba(255,194,71,.22), 0 10px 26px -14px rgba(255,194,71,.5);
}
.room.on .st{border-color:rgba(255,194,71,.35);color:#ffe0a3}
.room.on .st em{box-shadow:0 0 8px rgba(255,194,71,.9)}
.room-lounge{grid-column:1 / -1}

/* 가구 */
.fr{position:absolute;left:0;right:0;bottom:26px;height:54%;pointer-events:none;z-index:1}
.fr i{position:absolute;display:block;background:#34435f;border:1px solid rgba(255,255,255,.055);border-radius:3px}
/* 집무실: 책상·모니터·의자·화분 */
.fr-office .desk{left:12%;right:24%;bottom:5%;height:6px;border-radius:2px;background:#3f5070}
.fr-office .mon{width:20%;height:29%;bottom:12%;background:#1e3a52;border-color:rgba(120,200,255,.30)}
.fr-office .m1{left:17%}
.fr-office .m2{left:41%}
.fr-office .chair{width:13%;height:11%;bottom:0;border-radius:5px 5px 2px 2px;background:#2c3950}
.fr-office .c1{left:19%}
.fr-office .c2{left:44%}
.fr-office .plant{right:8%;bottom:4%;width:9%;height:30%;border-radius:4px 4px 3px 3px;
  background:#2f4a3c;border-color:rgba(120,220,150,.22)}
/* 작업실: 서버랙 */
.fr-work .rack{width:14%;height:52%;bottom:5%;background:#1d2c3c;border-color:rgba(120,200,255,.18)}
.fr-work .rack::before{content:"";position:absolute;inset:11% 18%;border-radius:1px;
  background:repeating-linear-gradient(180deg, rgba(120,220,255,.5) 0 2px, transparent 2px 7px)}
.fr-work .r1{left:14%}
.fr-work .r2{left:30%}
.fr-work .r3{left:46%}
.fr-work .led{left:64%;bottom:31%;width:5%;height:4%;border-radius:50%;background:rgba(52,211,153,.75);border:0}
/* 라운지: 소파·테이블·화분 */
.fr-lounge .sofa{left:9%;bottom:4%;width:29%;height:20%;border-radius:7px;background:#3d4d6c}
.fr-lounge .sofa::after{content:"";position:absolute;left:7%;right:7%;top:14%;height:56%;border-radius:5px;background:#48597a}
.fr-lounge .table{left:41%;bottom:5%;width:10%;height:9%;border-radius:50%;background:#2f3d57}
.fr-lounge .plant{right:8%;bottom:3%;width:6%;height:26%;border-radius:4px 4px 3px 3px;
  background:#2f4a3c;border-color:rgba(120,220,150,.22)}

/* 캐릭터 */
.char{
  position:absolute;z-index:5;width:72px;
  left:50%;top:82%;
  transform:translate(-50%,-50%);
  transition:left 1.05s cubic-bezier(.5,.02,.32,1), top 1.05s cubic-bezier(.5,.02,.32,1);
  pointer-events:none;
}
.char::before{
  content:"";position:absolute;left:50%;top:55%;width:150%;height:120%;
  transform:translate(-50%,-50%);pointer-events:none;z-index:-1;border-radius:50%;
  background:radial-gradient(circle, rgba(255,194,71,.17) 0%, rgba(255,194,71,.05) 45%, rgba(255,194,71,0) 70%);
}
.char-svg{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 0 2px rgba(6,9,15,.95)) drop-shadow(0 7px 12px rgba(0,0,0,.5))}
.char .body{transform-origin:50% 88%;animation:breathe 4.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,.988)}}
.char .hair-back{fill:#0d121b}
.char .hair{fill:url(#hairG)}
.char .skin{fill:url(#skinG)}
.char .suit-body{fill:url(#suitG);stroke:rgba(6,10,18,.55);stroke-width:.6}
.char .sleeve{fill:url(#suitG2);stroke:rgba(6,10,18,.45);stroke-width:.5}
.char .pants{fill:url(#pantsG);stroke:rgba(6,10,18,.45);stroke-width:.5}
.char .shoe{fill:url(#shoeG)}
.char .lapel{fill:url(#suitG2);opacity:.96;stroke:rgba(255,255,255,.05);stroke-width:.4}
.char .belt{fill:#0d121b}
.char .buckle{fill:url(#goldG)}
.char .collar{fill:url(#shirtG);stroke:rgba(120,135,160,.45);stroke-width:.45}
.char .suit .shirt{fill:url(#shirtG);stroke:rgba(18,24,36,.28);stroke-width:.55}
.char .suit .tie{fill:url(#tieG);stroke:rgba(230,214,178,.5);stroke-width:.45}
.char .suit .pin{fill:url(#goldG)}
.char .suit .badge{fill:url(#goldG);stroke:rgba(80,50,8,.55);stroke-width:.35}
.char .face .brow{stroke:#2a3346;stroke-width:1.9;stroke-linecap:round;fill:none}
.char .shades .lens{fill:url(#lensG);stroke:#05080d;stroke-width:.9;stroke-linejoin:round}
.char .shades .shine{fill:#ffffff;opacity:.5}
.char .shades .bridge{stroke:#05080d;stroke-width:1.3;stroke-linecap:round;fill:none}
.char .face .mouth{stroke:#8a5b41;stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round;fill:none}
.char .face .nose{stroke:#c08b62;stroke-width:.9;stroke-linecap:round;fill:none;opacity:.75}
.char .ear-txt{fill:#8a5b41}
.char .sh{fill:rgba(0,0,0,.45);animation:shad 4.4s ease-in-out infinite}
@keyframes shad{0%,100%{opacity:.42;transform:scaleX(1)}50%{opacity:.28;transform:scaleX(.92)}}
.char.walk{animation:step .3s ease-in-out infinite}
@keyframes step{0%,100%{transform:translate(-50%,-50%) rotate(0deg)}25%{transform:translate(-50%,-54%) rotate(-2deg)}50%{transform:translate(-50%,-50%) rotate(0deg)}75%{transform:translate(-50%,-54%) rotate(2deg)}}
.char.walk .body{animation-duration:1.2s}
.bubble{
  position:absolute;left:50%;bottom:calc(100% - 2px);
  transform:translate(calc(-50% + var(--bs,0px)),4px);
  width:max-content;max-width:min(190px,54vw);
  padding:6px 9px;border-radius:11px;
  font-size:10.5px;line-height:1.4;font-weight:700;color:#eef3ff;text-align:center;
  background:rgba(24,32,47,.97);border:1px solid rgba(255,255,255,.15);
  box-shadow:0 8px 22px -10px rgba(0,0,0,.9);
  opacity:0;transition:opacity .28s ease, transform .28s ease;
  pointer-events:none;
}
.bubble::after{
  content:"";position:absolute;left:calc(50% - var(--bs,0px));top:100%;width:8px;height:8px;
  transform:translate(-50%,-6px) rotate(45deg);
  background:rgba(24,32,47,.98);border-right:1px solid rgba(255,255,255,.15);border-bottom:1px solid rgba(255,255,255,.15);
}
.bubble.show{opacity:1;transform:translate(calc(-50% + var(--bs,0px)),0)}

/* 구역 상세 */
.zd{margin-top:8px;padding:10px 11px;border-radius:12px;background:rgba(255,255,255,.028);border:1px solid var(--line2)}
.zd-h{display:flex;align-items:center;gap:6px;min-width:0}
.zd-h .zd-i{font-size:13px;flex:0 0 auto}
.zd-h .zd-t{font-size:12.5px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zd-h .zd-b{margin-left:auto;flex:0 0 auto;font-size:8.5px;font-weight:900;letter-spacing:.05em;color:#ffd98a;
  padding:2px 7px;border-radius:999px;background:rgba(255,194,71,.10);border:1px solid rgba(255,194,71,.26);white-space:nowrap}
.zd ul{margin:7px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.zd li{position:relative;padding-left:12px;font-size:11px;line-height:1.45;color:#cad5e7}
.zd li::before{content:"";position:absolute;left:2px;top:6.5px;width:4px;height:4px;border-radius:50%;background:var(--acc);opacity:.85}

/* ---------- 현황판 ---------- */
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.m{padding:10px 11px;border-radius:14px;background:linear-gradient(180deg,#141b2a,#101623);
  border:1px solid var(--line);min-width:0}
.m.wide{grid-column:1 / -1}
.m .ml{display:flex;align-items:center;gap:5px;font-size:9.5px;font-weight:900;letter-spacing:.03em;color:var(--dim)}
.m .mv{margin-top:5px;display:flex;align-items:baseline;gap:4px;flex-wrap:wrap;min-width:0}
.m .mv b{font-size:22px;font-weight:900;letter-spacing:-.02em;line-height:1.1;color:#fff}
.m.wide .mv b{font-size:15px;letter-spacing:-.01em;line-height:1.35}
.m .mv span{font-size:9.5px;font-weight:800;color:var(--dim)}
.m .mn{margin-top:5px;font-size:9.5px;font-weight:700;color:var(--dim2);line-height:1.4}
.bar{margin-top:9px}
.bar-t{display:flex;justify-content:space-between;gap:8px;font-size:9.5px;font-weight:900;color:var(--dim2);margin-bottom:4px}
.bar-t i{font-style:normal;color:#ffd98a;white-space:nowrap}
.bar-g{height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bar-g em{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,#ffd98a,#ffb020);box-shadow:0 0 12px rgba(255,194,71,.5);
  transition:width .8s cubic-bezier(.3,.9,.3,1)}

/* ---------- 스케줄 ---------- */
.sch{overflow:hidden}
.sch-row{display:flex;align-items:center;gap:9px;padding:8px 11px;border-bottom:1px solid var(--line2);min-width:0}
.sch-row:last-child{border-bottom:0}
.sch-row.next{background:linear-gradient(90deg, rgba(255,194,71,.09), rgba(255,194,71,0))}
.sch-t{flex:0 0 auto;font-size:11.5px;font-weight:900;font-variant-numeric:tabular-nums;color:#e9eefb;width:44px}
.sch-l{flex:1 1 auto;min-width:0;font-size:11.5px;font-weight:700;color:#dfe6f4;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sch-d{flex:0 0 auto;font-size:8.5px;font-weight:900;color:#a8b6cd;padding:2px 6px;border-radius:6px;
  background:rgba(255,255,255,.06);border:1px solid var(--line2);white-space:nowrap}
.sch-row.next .sch-d{color:#1c1503;background:var(--acc);border-color:var(--acc)}
.sch-z{flex:0 0 auto;font-size:8px;font-weight:900;color:var(--dim2);width:28px;text-align:right;white-space:nowrap}

/* ---------- 타임라인 ---------- */
.tl{padding:10px 11px 2px}
.tl-row{position:relative;padding:0 0 12px 15px;min-width:0}
.tl-row::before{content:"";position:absolute;left:0;top:4px;width:7px;height:7px;border-radius:50%;
  background:var(--panel3);border:1.5px solid var(--dim2)}
.tl-row:first-child::before{background:var(--acc);border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,194,71,.14)}
.tl-row:not(:last-child)::after{content:"";position:absolute;left:3px;top:13px;bottom:0;width:1px;background:var(--line2)}
.tl-t{font-size:9.5px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--acc);letter-spacing:.02em}
.tl-x{margin-top:2px;font-size:11px;font-weight:700;color:#d5deef;line-height:1.4}

/* ---------- 실시간 시세판 ---------- */
.mkt{padding:2px 0 0;overflow:hidden}
.mkt-g{padding:9px 11px 8px;border-bottom:1px solid var(--line2)}
.mkt-g:last-child{border-bottom:0}
.mkt-gh{display:flex;align-items:center;gap:7px;min-width:0}
.mkt-gh b{font-size:11.5px;font-weight:900;color:#eef3ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mkt-row{display:flex;align-items:center;gap:8px;padding:6px 0 0;min-width:0}
.mkt-nm{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:1px}
.mkt-nm b{font-size:11px;font-weight:800;color:#dfe6f4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mkt-nm span{font-size:9px;font-weight:700;color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mkt-px{flex:0 0 auto;text-align:right;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:2px}
.mkt-px b{font-size:12.5px;font-weight:900;color:#fff;letter-spacing:-.02em}
.mkt-px span{font-size:8.5px;font-weight:800;color:var(--dim2)}
.mkt-px.mkt-go{color:#58a6ff;text-decoration:none;padding:5px 3px 5px 6px;margin:-5px -3px -5px 0;
  border-radius:7px;-webkit-tap-highlight-color:transparent;min-height:30px}
.mkt-px.mkt-go b{color:#58a6ff;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:2px}
.mkt-px.mkt-go span{color:#8fc0f5}
.mkt-px.mkt-go .arw{font-style:normal;font-size:9.5px;font-weight:900;color:#58a6ff;line-height:1;margin-left:1px}
.mkt-px.mkt-go:active{background:rgba(88,166,255,.16)}
.mkt-px.mkt-go:not(.ok) b{color:#8aa6c6;text-decoration-color:rgba(138,166,198,.55)}
.mkt-px.mkt-go:not(.ok) span{color:#6f859f}
.mkt-deals{padding:10px 11px 9px;border-top:1px solid var(--line);background:linear-gradient(180deg,rgba(111,157,255,.07),rgba(111,157,255,0))}
.mkt-dh{display:flex;align-items:center;gap:6px;min-width:0}
.mkt-dh b{font-size:11.5px;font-weight:900;color:#eaf1ff;white-space:nowrap}
.mkt-dh .k{margin-left:auto;flex:0 0 auto;font-size:8.5px;font-weight:900;letter-spacing:.02em;color:#9fc0ff;
  padding:2px 7px;border-radius:999px;background:rgba(111,157,255,.12);border:1px solid rgba(111,157,255,.28);white-space:nowrap}
.mkt-ft{margin-top:5px;font-size:8.5px;font-weight:700;color:#606e86;font-variant-numeric:tabular-nums}

<script>
(function(){
  "use strict";

  var ZONE_POS_M = {
    office: { x: 27, y: 36 },
    work:   { x: 73, y: 36 },
    lounge: { x: 50, y: 86 }
  };
  var ZONE_POS_D = {
    office: { x: 18, y: 50 },
    work:   { x: 50, y: 50 },
    lounge: { x: 84, y: 50 }
  };
  var ZONE_NAME = { office: "집무실", work: "작업실", lounge: "라운지" };
  var FB_BASE = "https://seonongs-hq-default-rtdb.firebaseio.com";
  var FIREBASE_URL = FB_BASE + "/office_state.json";
  var MARKET_ROOT = FB_BASE + "/market_prices";
  var MARKET_URL = MARKET_ROOT + ".json";

  var FALLBACK = JSON.parse(document.getElementById("fallback-state").textContent);
  var state = FALLBACK;
  var selected = null;
  var raw = null;             /* 마지막으로 받은 원본(Firebase/로컬) */
  var srcName = "inline";     /* inline | local | firebase */
  var fbOk = false;           /* Firebase 조회·스트림 정상 여부 */
  var streamOk = false;       /* SSE 수신 중 여부 */
  var es = null;
  var charEl = document.getElementById("char");
  var bubbleEl = document.getElementById("bubble");
  var bubbleTimer = null;
  var walkTimer = null;
  var liveTxt = document.getElementById("liveTxt");

  function $(id){ return document.getElementById(id); }
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }
  function fmt(n){
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  }

  /* ---------- 캐릭터 이동 ---------- */
  function posFor(zone){
    var wide = window.matchMedia("(min-width:760px)").matches;
    var set = wide ? ZONE_POS_D : ZONE_POS_M;
    return set[zone] || set.lounge;
  }

  function moveChar(zone, instant){
    var p = posFor(zone);
    if (instant){
      charEl.style.transition = "none";
      charEl.style.left = p.x + "%";
      charEl.style.top = p.y + "%";
      void charEl.offsetWidth;
      charEl.style.transition = "";
      charEl.classList.add("walk");
      clearTimeout(walkTimer);
      walkTimer = setTimeout(function(){ charEl.classList.remove("walk"); }, 500);
      return;
    }
    charEl.classList.add("walk");
    charEl.style.left = p.x + "%";
    charEl.style.top = p.y + "%";
    clearTimeout(walkTimer);
    walkTimer = setTimeout(function(){ charEl.classList.remove("walk"); }, 1060);
  }

  function clampBubble(){
    bubbleEl.style.setProperty("--bs", "0px");
    var br = bubbleEl.getBoundingClientRect();
    var mr = document.querySelector(".map").getBoundingClientRect();
    var dx = 0;
    if (br.left < mr.left + 6) dx = (mr.left + 6) - br.left;
    else if (br.right > mr.right - 6) dx = (mr.right - 6) - br.right;
    bubbleEl.style.setProperty("--bs", dx.toFixed(1) + "px");
  }

  function say(text, hold){
    if (!text) return;
    bubbleEl.textContent = text;
    bubbleEl.classList.add("show");
    clampBubble();
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function(){ bubbleEl.classList.remove("show"); }, hold || 4200);
  }

  /* ---------- 구역 선택 ---------- */
  function selectZone(zone, opts){
    opts = opts || {};
    var data = (state.zones || []).filter(function(z){ return z.id === zone; })[0];
    if (!data) return;
    selected = zone;
    document.querySelectorAll(".room").forEach(function(r){
      var on = r.getAttribute("data-zone") === zone;
      r.classList.toggle("on", on);
      r.setAttribute("aria-pressed", on ? "true" : "false");
    });
    $("zdIcon").textContent = data.icon || "•";
    $("zdTitle").textContent = data.title || ZONE_NAME[zone];
    var isHere = state.butler && state.butler.zone === zone;
    $("zdBadge").textContent = isHere ? "현재 위치" : (data.tag || "이동");
    $("zdList").innerHTML = (data.lines || []).map(function(l){
      return "<li>" + esc(l) + "</li>";
    }).join("");
    moveChar(zone, opts.instant);
    var bub = (state.zoneBubbles || {})[zone];
    if (bub) say(bub, 3800);
  }

  /* ---------- 현황판 ---------- */
  function renderMetrics(){
    var html = (state.metrics || []).map(function(m){
      return '<div class="m' + (m.wide ? " wide" : "") + '">' +
        '<div class="ml"><span>' + esc(m.icon || "•") + '</span>' + esc(m.label) + '</div>' +
        '<div class="mv"><b>' + esc(m.value) + '</b>' + (m.unit ? '<span>' + esc(m.unit) + '</span>' : '') + '</div>' +
        (m.note ? '<div class="mn">' + esc(m.note) + '</div>' : '') +
        '</div>';
    }).join("");
    var g = state.goal;
    if (g && g.target){
      var pct = Math.max(0, Math.min(100, (g.current / g.target) * 100));
      var left = Math.max(0, g.target - g.current);
      html += '<div class="m wide">' +
        '<div class="ml"><span>🎯</span>' + esc(g.label || "목표") + '</div>' +
        '<div class="bar">' +
          '<div class="bar-t"><span>' + esc(fmt(g.current)) + ' / ' + esc(fmt(g.target)) + '점</span><i>' + esc(fmt(left)) + '점 남음</i></div>' +
          '<div class="bar-g"><em style="width:' + pct.toFixed(1) + '%"></em></div>' +
        '</div></div>';
    }
    $("metrics").innerHTML = html;
  }

  /* ---------- 스케줄 ---------- */
  function nextRunOf(item, now){
    var hm = String(item.time).split(":");
    var hh = parseInt(hm[0], 10), mm = parseInt(hm[1], 10);
    if (item.date){
      var d = new Date(item.date + "T" + item.time + ":00");
      return isNaN(d.getTime()) ? null : (d > now ? d : null);
    }
    var days = item.days || [0,1,2,3,4,5,6];
    for (var k = 0; k < 8; k++){
      var cand = new Date(now.getFullYear(), now.getMonth(), now.getDate() + k, hh, mm, 0, 0);
      if (days.indexOf(cand.getDay()) === -1) continue;
      if (cand > now) return cand;
    }
    return null;
  }

  function renderSchedule(){
    var list = state.schedule || [];
    var now = new Date();
    var best = null, bestIdx = -1;
    list.forEach(function(item, i){
      var t = nextRunOf(item, now);
      if (t && (!best || t < best)){ best = t; bestIdx = i; }
    });
    $("sched").innerHTML = list.map(function(item, i){
      return '<div class="sch-row' + (i === bestIdx ? " next" : "") + '">' +
        '<div class="sch-t">' + esc(item.time) + '</div>' +
        '<div class="sch-l">' + esc(item.label) + '</div>' +
        '<div class="sch-d">' + esc(item.tag || "") + '</div>' +
        '<div class="sch-z">' + esc(ZONE_NAME[item.zone] || "") + '</div>' +
        '</div>';
    }).join("");
    if (best){
      var mins = Math.round((best - now) / 60000);
      var when = mins < 60 ? (mins + "분 뒤")
        : (mins < 1440 ? Math.floor(mins / 60) + "시간 뒤"
        : (best.getMonth() + 1) + "/" + best.getDate());
      $("nextTag").textContent = "NEXT · " + when;
    } else {
      $("nextTag").textContent = "";
    }
  }

  function renderLogs(){
    $("logs").innerHTML = (state.logs || []).map(function(l){
      return '<div class="tl-row"><div class="tl-t">' + esc(l.time) + ' · ' + esc(ZONE_NAME[l.zone] || "") + '</div>' +
        '<div class="tl-x">' + esc(l.text) + '</div></div>';
    }).join("");
  }

  function renderStatus(){
    document.querySelectorAll(".room").forEach(function(r){
      var z = r.getAttribute("data-zone");
      var d = (state.zones || []).filter(function(x){ return x.id === z; })[0];
      var badge = r.querySelector("[data-st]");
      if (badge && d && d.tag) badge.textContent = d.tag;
    });
    if (state.butler && state.butler.name){
      var p = document.querySelector(".brand p");
      p.innerHTML = "<b>" + esc(state.butler.name) + " HQ</b> · PERSONAL SECRETARIAT";
    }
    var badge, badgeTitle;
    if (srcName === "firebase"){
      badge = fbOk ? "LIVE (Firebase)" : "LIVE (재연결)";
      badgeTitle = fbOk ? "Firebase 실시간 DB 연결됨 · 변경 즉시 반영" : "Firebase 재연결 중 · 마지막 수신 데이터 표시";
    } else if (srcName === "local"){
      badge = "LIVE";
      badgeTitle = "office-state.json 연결됨 (Firebase 대체)";
    } else {
      badge = "내장 데이터";
      badgeTitle = "내장 데이터로 표시 중";
    }
    liveTxt.textContent = badge;
    $("live").classList.toggle("off", srcName === "inline");
    $("live").title = badgeTitle;
    var chip = $("linkChip");
    if (chip){
      if (srcName === "firebase"){
        chip.textContent = "🔥 Firebase 실시간 연결됨";
        chip.classList.add("on");
      } else if (srcName === "local"){
        chip.textContent = "🔗 로컬 스냅샷 표시 중";
        chip.classList.remove("on");
      } else {
        chip.textContent = "내장 데이터 표시 중";
        chip.classList.remove("on");
      }
    }
    var sn = $("srcNote");
    if (sn){
      sn.textContent = srcName === "firebase" ? "Firebase 실시간 · 10초 폴백"
        : (srcName === "local" ? "office-state.json · 30초 갱신" : "내장 데이터");
    }
    $("syncAt").textContent = timeNow();
  }

  function timeNow(){
    var d = new Date();
    function p(n){ return (n < 10 ? "0" : "") + n; }
    return p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  }

  /* ---------- 데이터 ---------- */
  function isObj(v){ return !!v && typeof v === "object" && !Array.isArray(v); }

  /* patch 데이터를 base 위에 병합(배열은 통째로 교체) */
  function mergeDeep(base, patch){
    if (Array.isArray(patch)) return patch.slice();
    if (!isObj(patch)) return patch;
    var out = {}, k;
    if (isObj(base)) for (k in base) if (Object.prototype.hasOwnProperty.call(base, k)) out[k] = base[k];
    for (k in patch) if (Object.prototype.hasOwnProperty.call(patch, k)){
      var pv = patch[k], bv = out[k];
      out[k] = (isObj(pv) && isObj(bv)) ? mergeDeep(bv, pv) : (Array.isArray(pv) ? pv.slice() : pv);
    }
    return out;
  }

  function cloneData(v){
    if (Array.isArray(v)) return v.map(cloneData);
    if (isObj(v)){
      var o = {}, k;
      for (k in v) if (Object.prototype.hasOwnProperty.call(v, k)) o[k] = cloneData(v[k]);
      return o;
    }
    return v;
  }

  /* Firebase 경로(/a/b) 값을 obj에 반영 */
  function setPath(obj, path, val, merge){
    var parts = String(path == null ? "" : path).split("/").filter(function(s){ return s !== ""; });
    if (!parts.length) return (merge && isObj(obj) && isObj(val)) ? mergeDeep(obj, val) : val;
    var root = isObj(obj) ? obj : {};
    var cur = root, i;
    for (i = 0; i < parts.length - 1; i++){
      var k = parts[i];
      if (!isObj(cur[k])) cur[k] = {};
      cur = cur[k];
    }
    var last = parts[parts.length - 1];
    cur[last] = (merge && isObj(cur[last]) && isObj(val)) ? mergeDeep(cur[last], val) : val;
    return root;
  }

  function view(rawObj){ return mergeDeep(FALLBACK, rawObj || {}); }

  function apply(next){
    if (!next || typeof next !== "object" || !next.zones) return false;
    var prevZone = (state.butler && state.butler.zone) || null;
    var prevBubble = (state.butler && state.butler.bubble) || null;
    state = next;
    renderMetrics();
    renderSchedule();
    renderLogs();
    renderStatus();
    var zone = (state.butler && state.butler.zone) || "lounge";
    if (!selected){
      selectZone(zone, { instant: true });
      if (state.butler && state.butler.bubble) say(state.butler.bubble, 5200);
      return true;
    }
    /* 실시간 갱신: 캐릭터 위치·말풍선이 바뀌면 같은 몸으로 바로 이동 */
    if (zone !== prevZone){
      moveChar(zone);
      var pushed = (state.butler && state.butler.bubble && state.butler.bubble !== prevBubble) ? state.butler.bubble : "";
      var bub = pushed || (state.zoneBubbles || {})[zone] || (state.butler && state.butler.bubble) || "";
      if (bub) say(bub, 4600);
      var curZone = (state.zones || []).filter(function(z){ return z.id === selected; })[0];
      if (curZone) $("zdBadge").textContent = (selected === zone) ? "현재 위치" : (curZone.tag || "이동");
    } else if (state.butler && state.butler.bubble && state.butler.bubble !== prevBubble){
      say(state.butler.bubble, 5200);
    }
    return true;
  }

  function applyRaw(obj){
    raw = obj;
    return apply(view(raw));
  }

  function fetchJSON(url){
    var u = url + (url.indexOf("?") < 0 ? "?" : "&") + "t=" + Date.now();
    return fetch(u, { cache: "no-store" }).then(function(r){
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }

  /* 1순위 Firebase → 2순위 office-state.json → 3순위 인라인 */
  function load(){
    return fetchJSON(FIREBASE_URL)
      .then(function(d){
        if (!isObj(d) || !d.zones) throw new Error("empty");
        fbOk = true;
        srcName = "firebase";
        return applyRaw(d);
      })
      .catch(function(){
        if (srcName === "firebase" && raw){ fbOk = false; return false; }  /* 이미 받은 Firebase 데이터는 유지 */
        return fetchJSON("./office-state.json")
          .then(function(d){
            if (!isObj(d) || !d.zones) throw new Error("empty");
            srcName = "local";
            return applyRaw(d);
          })
          .catch(function(){ srcName = "inline"; return false; });
      })
      .then(function(v){ renderStatus(); return v; });
  }

  /* ---------- Firebase REST 스트리밍(SSE) ---------- */
  function onStream(kind, ev){
    var msg;
    try { msg = JSON.parse(ev.data); } catch (e){ return; }
    if (!isObj(msg)) return;
    var path = msg.path || "/", data = msg.data;
    if ((path === "/" || path === "") && kind === "put"){
      if (!isObj(data)) return;
      raw = data;
    } else if ((path === "/" || path === "") && kind === "patch"){
      if (!isObj(data)) return;
      raw = mergeDeep(raw || {}, data);
    } else {
      raw = setPath(cloneData(raw || {}), path, data, kind === "patch");
    }
    srcName = "firebase";
    fbOk = true;
    applyRaw(raw);
    renderStatus();
  }

  function connectStream(){
    if (!window.EventSource || es) return;
    try { es = new EventSource(FIREBASE_URL); } catch (e){ es = null; return; }
    es.addEventListener("open", function(){
      streamOk = true;
      fbOk = true;
      if (!raw) load();
      renderStatus();
    });
    es.addEventListener("put", function(ev){ onStream("put", ev); });
    es.addEventListener("patch", function(ev){ onStream("patch", ev); });
    es.addEventListener("error", function(){
      streamOk = false;
      renderStatus();
    });
  }

  /* ---------- 이벤트 ---------- */
  document.querySelectorAll(".room").forEach(function(r){
    r.addEventListener("click", function(){ selectZone(r.getAttribute("data-zone")); });
  });

  $("refresh").addEventListener("click", function(){
    var b = this;
    b.classList.remove("spin");
    void b.offsetWidth;
    b.classList.add("spin");
    liveTxt.textContent = "새로고침 중";
    load().then(function(){ renderStatus(); });
    marketLoad();
    say("형님, 최신 버전으로 새로고침합니다.", 2600);
    setTimeout(function(){
      if (window.__PTR_TEST__){ window.__PTR_LAST__ = targetUrl(); return; }
      location.replace(targetUrl());
    }, 260);
  });

  window.addEventListener("resize", function(){
    if (selected) moveChar(selected, true);
    if (bubbleEl.classList.contains("show")) clampBubble();
  });

  document.addEventListener("visibilitychange", function(){
    if (!document.hidden) load();
  });

  /* ---------- 실시간 저가 시세판 ---------- */
  var market = null;
  var marketEs = null;

  function unitOf(it){
    var u = +it.unit_price;
    if (u > 0) return Math.round(u);
    var p = +it.price || 0, q = +it.qty || 0;
    return (p > 0 && q > 0) ? Math.round(p / q) : 0;
  }
  function fmtAt(v){
    if (!v) return "";
    var d = typeof v === "number" ? new Date(v) : new Date(String(v));
    if (isNaN(d.getTime())) return String(v);
    function p(n){ return (n < 10 ? "0" : "") + n; }
    return p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }
  function buyUrl(v){
    var s = String(v == null ? "" : v).trim();
    return /^https:\/\/[^\s]+$/i.test(s) ? s : "";
  }
  function setMarketState(ok){
    var t = $("mktLiveTxt");
    var box = $("mktLive");
    if (t) t.textContent = ok ? "실시간" : "내장";
    if (box) box.classList.toggle("off", !ok);
  }
  function renderMarket(){
    var box = $("mkt");
    if (!box) return;
    var data = market;
    if (!data || !data.groups || !data.groups.length){
      box.innerHTML = '<div class="mkt-empty">시세 데이터를 불러오지 못했습니다.</div>';
      return;
    }
    var stamp = $("mktStamp");
    if (stamp) stamp.textContent = data.updated_at ? ("실측 " + fmtAt(data.updated_at)) : "SYNC";
    var html = "";
    data.groups.forEach(function(g){
      var items = (g.items || []).slice().sort(function(a, b){ return unitOf(a) - unitOf(b); });
      html += '<div class="mkt-g"><div class="mkt-gh"><b>' + esc(g.label) + '</b></div>';
      items.forEach(function(it){
        var u = unitOf(it);
        var url = buyUrl(it.url);
        var px = '<b>' + esc(fmt(u)) + '</b><span>' + esc(g.unit || "원") + '</span>';
        var pxHtml = url
          ? '<a class="mkt-px mkt-go ok" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer"' +
            ' aria-label="' + esc(it.name) + ' 구매 페이지 열기">' + px + '<i class="arw">↗</i></a>'
          : '<span class="mkt-px">' + px + '</span>';
        html += '<div class="mkt-row">' +
          '<span class="mkt-nm"><b>' + esc(it.name) + '</b><span>' + esc(it.vendor || "") + ' · ' +
          esc(fmt(+it.price || 0)) + '원 · ' + esc(String(it.qty || 0)) + esc(g.qty_unit || "매") + '</span></span>' +
          pxHtml +
          '</div>';
      });
      var last = (g.items || []).reduce(function(m, x){
        var t = x.measured_at || "";
        return (t && (!m || t > m)) ? t : m;
      }, "");
      html += '<div class="mkt-ft">마지막 실측 ' + esc(fmtAt(last || data.updated_at) || "-") +
        ' · 단가 탭 시 구매처</div></div>';
    });
    var deals = (data.eomisae_deals || []).map(function(d){ return d || {}; })
      .filter(function(d){ return d.title && (+d.price > 0); });
    if (deals.length){
      deals.sort(function(a, b){ return (+a.price || 0) - (+b.price || 0); });
      html += '<div class="mkt-deals"><div class="mkt-dh"><b>🛒 어미새 알짜 핫딜</b><span class="k">오늘 실측</span></div>';
      deals.forEach(function(d){
        var url = buyUrl(d.url);
        var px = '<b>' + esc(fmt(+d.price || 0)) + '원</b>' + (d.unit ? '<span>· ' + esc(d.unit) + '</span>' : '');
        var pxHtml = url
          ? '<a class="mkt-px mkt-go ok" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer"' +
            ' aria-label="' + esc(d.title) + ' 딜 페이지 열기">' + px + '<i class="arw">↗</i></a>'
          : '<span class="mkt-px">' + px + '</span>';
        html += '<div class="mkt-row">' +
          '<span class="mkt-nm"><b>' + esc(d.title) + '</b><span>' + esc(d.vendor || "어미새") + '</span></span>' +
          pxHtml + '</div>';
      });
      html += '</div>';
    }
    box.innerHTML = html;
  }

  function marketLoad(){
    return fetchJSON(MARKET_URL)
      .then(function(d){
        if (!d || !d.groups) throw new Error("empty");
        market = d;
        setMarketState(true);
        renderMarket();
      })
      .catch(function(){
        setMarketState(false);
        if (!market){
          try { market = JSON.parse(document.getElementById("fallback-market").textContent); } catch (e){ market = null; }
        }
        renderMarket();
      });
  }

  function marketStream(){
    if (!window.EventSource || marketEs) return;
    try { marketEs = new EventSource(MARKET_URL); } catch (e){ marketEs = null; return; }
    marketEs.addEventListener("put", function(ev){
      var m; try { m = JSON.parse(ev.data || "{}"); } catch (e){ return; }
      var segs = String(m.path == null ? "/" : m.path).replace(/^\/+/, "").split("/").filter(function(s){ return s !== ""; });
      if (segs.length && segs[0] === "market_prices") segs.shift();
      var path = "/" + segs.join("/");
      if (!segs.length){
        if (m.data && m.data.groups){ market = m.data; setMarketState(true); renderMarket(); }
      } else {
        var cur = JSON.parse(JSON.stringify(market || {}));
        cur = setPath(cur, path, m.data, false);
        if (m.data === null){ try { marketLoad(); } catch (e){} return; }
        if (cur && cur.groups){ market = cur; setMarketState(true); renderMarket(); }
      }
    });
    marketEs.addEventListener("error", function(){ setMarketState(false); });
  }

  /* ---------- 새로고침 (iOS 홈화면 웹앱 캐시 우회) ---------- */
  function targetUrl(){
    var u = location.pathname + location.search;
    u = u.replace(/([?&])v=\d+/g, function(t, s){ return s === "?" ? "?" : ""; });
    u = u.replace(/\?&/, "?").replace(/[?&]$/, "");
    return u + (u.indexOf("?") >= 0 ? "&" : "?") + "v=" + Date.now();
  }

  /* ---------- 시작 ---------- */
  apply(FALLBACK);
  load();
  connectStream();
  marketLoad();
  marketStream();
  setInterval(function(){ if (!streamOk) load(); }, 10000);
  setInterval(function(){
    if (document.hidden) return;
    if (!marketEs || !marketEs.readyState) marketLoad();
  }, 30000);
  window.addEventListener("online", function(){ marketLoad(); });
  setTimeout(function(){
    if (state.butler && state.butler.bubble) say(state.butler.bubble, 6000);
  }, 1800);
})();
</script>
