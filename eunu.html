<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="은우방">
<meta name="description" content="은우방 · EUNU — 가족 전용 하루하루 기록">
<meta name="robots" content="noindex, nofollow">
<title>은우방 · EUNU</title>
<link rel="apple-touch-icon" sizes="180x180" href="./eunu-icon.png">
<link rel="icon" type="image/png" sizes="180x180" href="./eunu-icon.png">
<style>
:root{
  --bg:#0a0f1e; --bg2:#0f172a;
  --panel:#131c31; --panel2:#182238; --panel3:#1e2a42;
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.06);
  --txt:#f3f6fc; --dim:#98a6bf; --dim2:#7c8aa2;
  --gold:#ffc247; --gold2:#f0c465; --mint:#7fe3b4; --sky:#7fb6ff; --rose:#ff9f9a; --warn:#ff9f6b;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Pretendard",system-ui,sans-serif;
  font-size:15px;line-height:1.45;
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
  word-break:keep-all;overflow-wrap:break-word;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(120% 58% at 50% -12%, #1a2742 0%, rgba(10,15,30,0) 64%),
    radial-gradient(85% 48% at 100% 102%, rgba(255,194,71,.055) 0%, rgba(10,15,30,0) 70%);
}
.wrap{position:relative;z-index:1;width:100%;max-width:760px;margin:0 auto;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 26px)}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- 상단 바 (비서실 · 오락실과 동일 규격) ---------- */
.top{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;border-radius:var(--r);
  background:linear-gradient(180deg, rgba(22,30,46,.94), rgba(16,22,34,.94));
  border:1px solid var(--line);
}
.mark{
  flex:0 0 auto;width:40px;height:40px;border-radius:12px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 30% 25%, #2a3550, #161e2e);
}
.mark img{display:block;width:100%;height:100%;object-fit:cover}
.brand{flex:1 1 auto;min-width:0}
.brand h1{
  margin:0;font-size:16.5px;line-height:1.2;font-weight:900;letter-spacing:-.015em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.brand p{
  margin:3px 0 0;font-size:9px;font-weight:800;letter-spacing:.055em;color:var(--dim2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.brand p b{color:#e2c98c;font-weight:900}
.tools{flex:0 0 auto;display:flex;align-items:center;gap:6px}
.rbtn{
  position:relative;flex:0 0 auto;width:34px;height:34px;border-radius:11px;cursor:pointer;text-decoration:none;
  display:flex;align-items:center;justify-content:center;font-family:inherit;padding:0;
  font-size:15px;line-height:1;
  color:var(--txt);background:var(--panel3);border:1px solid var(--line);
  transition:transform .2s, background .2s;
}
.rbtn:active{transform:scale(.94);background:#232f47}
.rbtn.spin{animation:spin .7s linear}
.rbtn .em{font-size:13.5px;line-height:1}
.rbtn .cnt{position:absolute;top:-4px;right:-4px;display:inline-flex;align-items:center;justify-content:center;
  min-width:15px;height:15px;padding:0 4px;border-radius:99px;font-size:8.6px;font-weight:900;line-height:1;
  color:#1c1503;background:linear-gradient(180deg,#ffd77a,#ffb928);
  border:1.5px solid #101725;font-variant-numeric:tabular-nums}
.rbtn .cnt[hidden]{display:none}

/* ---------- 히어로 (요약 카드) ---------- */
.hero{margin-top:12px;border-radius:var(--r);border:1px solid var(--line);overflow:hidden;
  background:linear-gradient(180deg,#16203a,#101827)}
.hero-top{display:flex;align-items:center;gap:8px;padding:13px 13px 12px}
.who{flex:1 1 auto;min-width:0;display:flex;align-items:baseline;gap:7px}
.who strong{flex:0 0 auto;font-size:17px;font-weight:900;letter-spacing:-.015em;line-height:1.2;white-space:nowrap}
.who span{flex:0 1 auto;min-width:0;font-size:11px;font-weight:800;color:#a8b8d0;line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;
  letter-spacing:-.005em}
.who span b{color:#ffe1a0;font-weight:900;font-variant-numeric:tabular-nums}
.live{flex:0 0 auto;margin-left:auto;display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 8px;
  border-radius:999px;font-size:8.5px;font-weight:900;letter-spacing:.06em;color:#cfe6da;
  background:rgba(52,211,153,.10);border:1px solid rgba(52,211,153,.30);white-space:nowrap}
.live i{width:6px;height:6px;border-radius:50%;background:var(--mint);display:block;animation:pulse 2.4s ease-in-out infinite}
.live.off{color:#f3d2c2;background:rgba(255,159,107,.10);border-color:rgba(255,159,107,.30)}
.live.off i{background:var(--warn);animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.32}}

.hg-wrap{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line2);
  border-top:1px solid var(--line2)}
.hg{background:#111a2b;padding:8px 11px;min-width:0}
.hg b{display:block;font-size:8.6px;font-weight:900;letter-spacing:.05em;color:var(--dim2)}
.hg span{display:block;margin-top:2px;font-size:11px;font-weight:800;color:#e7eefa;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hg span.gold{color:#ffd98a}
.hg span.mint{color:#8fe9c2}

/* ---------- 섹션 ---------- */
.sec{margin-top:14px}
.sec-h{display:flex;align-items:center;gap:7px;margin:0 2px 7px;min-width:0}
.sec-h h2{margin:0;font-size:12.5px;font-weight:900;letter-spacing:.01em;white-space:nowrap}
.sec-h .k{font-size:8.6px;font-weight:900;letter-spacing:.12em;color:var(--dim2);white-space:nowrap}
.sec-h .sp{flex:1 1 auto}

/* 필터 */
.filters{display:flex;align-items:center;gap:5px;margin:0 0 8px;overflow-x:auto;padding-bottom:2px;
  scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:27px;padding:0 10px;border-radius:999px;cursor:pointer;font:inherit;
  font-size:10.5px;font-weight:900;color:#c3cfe2;background:rgba(255,255,255,.045);
  border:1px solid var(--line2);white-space:nowrap;transition:background .18s,color .18s,border-color .18s}
.chip.on{color:#1c1503;background:linear-gradient(180deg,#ffd77a,#ffb928);border-color:rgba(255,194,71,.6);
  box-shadow:0 6px 14px -8px rgba(255,194,71,.9)}
.chip.sort{margin-left:auto;color:#a9b8d0}

/* 월별 필터 (두 번째 줄 · 데이터에서 자동 생성) */
.mrow{display:flex;align-items:center;gap:5px;margin:-1px 0 8px;overflow-x:auto;padding-bottom:2px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.mrow::-webkit-scrollbar{display:none}
.mrow[hidden]{display:none}
.mlab{flex:0 0 auto;font-size:9px;font-weight:900;letter-spacing:.06em;color:#8e9bb3;
  padding:0 2px 0 1px;white-space:nowrap}
.chip.mon{height:24px;padding:0 9px;font-size:10px;font-weight:900;color:#b9c6da;
  background:rgba(127,182,255,.055);border-color:rgba(127,182,255,.16)}
.chip.mon.on{color:#0c1727;background:linear-gradient(180deg,#b6d7ff,#7fb6ff);
  border-color:rgba(127,182,255,.62);box-shadow:0 6px 14px -8px rgba(127,182,255,.85)}

/* 보기 전환 (일기 · 식판 · 활동 · 통계) — 전체 폭 4등분 세그먼트 */
.vtog{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;width:100%;margin:0 0 9px;padding:3px;
  border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line2)}
.vbtn{min-width:0;height:31px;padding:0 2px;border-radius:9px;cursor:pointer;font:inherit;
  font-size:10.6px;font-weight:900;letter-spacing:-.02em;color:#aebbcf;background:transparent;border:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:background .18s,color .18s;line-height:1;
  display:flex;align-items:center;justify-content:center;gap:3px}
.vbtn .vi{font-size:11px;line-height:1;flex:0 0 auto}
.vbtn.on{color:#1c1503;background:linear-gradient(180deg,#ffd77a,#ffb928);
  box-shadow:0 6px 14px -9px rgba(255,194,71,.95)}
.vbtn:active{transform:scale(.96)}

/* 키워드 검색 */
.srow{display:flex;align-items:center;gap:6px;margin:0 0 8px}
.sbox{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:7px;height:34px;padding:0 4px 0 10px;
  border-radius:11px;background:rgba(255,255,255,.045);border:1px solid var(--line2);
  transition:border-color .18s,background .18s}
.sbox:focus-within{border-color:rgba(255,194,71,.42);background:rgba(255,255,255,.065)}
.sic{flex:0 0 auto;font-size:11px;line-height:1;opacity:.72}
.sinp{flex:1 1 auto;min-width:0;height:100%;padding:0;border:0;outline:0;background:transparent;
  font:inherit;font-size:12px;font-weight:700;color:var(--txt);letter-spacing:-.01em;
  -webkit-appearance:none;appearance:none;border-radius:0}
.sinp::placeholder{color:#71809a;font-weight:700}
.sinp::-webkit-search-cancel-button,.sinp::-webkit-search-decoration{-webkit-appearance:none;display:none}
.sx{flex:0 0 auto;width:26px;height:26px;border-radius:8px;cursor:pointer;font:inherit;font-size:11px;
  font-weight:900;color:#c9d5e8;background:rgba(255,255,255,.07);border:1px solid var(--line2);padding:0;
  line-height:1}
.sx[hidden]{display:none}
.sx:active{transform:scale(.92)}
.scnt{flex:0 0 auto;font-size:9.5px;font-weight:900;color:#8e9bb3;white-space:nowrap;
  font-variant-numeric:tabular-nums;padding:0 2px}
.scnt[hidden]{display:none}
.empty .esub{display:block;margin-top:4px;font-size:9.6px;font-weight:700;color:#66748c}

/* 식판 앨범 */
#album[hidden],#list[hidden],.filters[hidden]{display:none}
.albmeta{margin:0 2px 8px;font-size:9.4px;font-weight:800;
  color:#8e9bb3;font-variant-numeric:tabular-nums;min-height:13px;line-height:1.5}
.albmeta b{color:#ffd98a;font-weight:900}
.albmeta .dot{display:inline-block;width:3px;height:3px;border-radius:50%;background:#3d4a63;
  margin:0 5px 2px;vertical-align:middle}
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.acard{display:block;width:100%;padding:0;margin:0;text-align:left;font:inherit;color:var(--txt);cursor:zoom-in;
  border-radius:13px;overflow:hidden;background:linear-gradient(180deg,#141d31,#10182a);
  border:1px solid var(--line);transition:transform .16s,border-color .18s}
.acard:active{transform:scale(.985);border-color:rgba(255,194,71,.42)}
.aimg{position:relative;display:block;width:100%;aspect-ratio:4/3;overflow:hidden;
  background:linear-gradient(100deg,#131c2e 30%,#1b263c 50%,#131c2e 70%);
  background-size:220% 100%;animation:shimmer 1.5s linear infinite}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-40% 0}}
.aimg img{display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .26s}
.aimg img.on{opacity:1}
.aimg .ano{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:15px;line-height:1;opacity:.22}
.aimg.loaded{animation:none;background:#0b1322}
.aimg.loaded .ano{display:none}
.aimg.nod .ano{display:flex;opacity:.55;font-size:8.8px;font-weight:800;color:#7f8ea6}
.afoot{display:block;padding:6px 8px 7px;min-width:0}
.afd{display:flex;align-items:baseline;gap:4px;min-width:0}
.afd b{font-size:10.6px;font-weight:900;letter-spacing:-.01em;color:#ffe1a0;
  font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.2}
.afd span{font-size:8.7px;font-weight:900;color:#8e9bb3;white-space:nowrap;line-height:1.2}
.al{display:block;margin-top:3px;font-size:9.3px;line-height:1.35;font-weight:700;color:#a9b8d0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 활동 앨범 (식판 앨범 규격 공유 + 장수 배지) */
#act[hidden],#stats[hidden],#srow[hidden]{display:none}
.acnt{position:absolute;right:7px;bottom:7px;font-size:9px;font-weight:900;line-height:1.45;
  color:#1c1503;background:rgba(255,215,122,.95);border-radius:6px;padding:2px 6px;
  font-variant-numeric:tabular-nums}
.acnt[hidden]{display:none}

/* 상세 시트 안 활동 사진 스트립 */
.astrip{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none;
  -webkit-overflow-scrolling:touch}
.astrip::-webkit-scrollbar{display:none}
.athumb{flex:0 0 auto;width:88px;height:88px;padding:0;margin:0;border-radius:11px;overflow:hidden;
  cursor:zoom-in;background:#0b1322;border:1px solid var(--line);line-height:0}
.athumb img{display:block;width:100%;height:100%;object-fit:cover}
.athumb:active{transform:scale(.97);border-color:rgba(255,194,71,.42)}

/* ---------- 통계 ---------- */
.sc{margin:0 0 9px;padding:14px 15px 15px;border-radius:15px;
  background:linear-gradient(180deg,#141d31,#10182a);border:1px solid var(--line)}
.sc-h{display:flex;align-items:baseline;gap:7px;margin:0 0 12px;min-width:0}
.sc-h b{font-size:12.4px;font-weight:900;letter-spacing:-.01em;white-space:nowrap}
.sc-h span{margin-left:auto;font-size:9.9px;font-weight:800;color:#8b9ab2;white-space:nowrap;
  font-variant-numeric:tabular-nums}
.sc-h.tight{margin-bottom:9px}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.k{background:rgba(255,255,255,.035);border:1px solid var(--line2);border-radius:12px;
  padding:10px 12px 11px;min-width:0}
.k b{display:block;font-size:9px;font-weight:900;letter-spacing:.02em;color:#93a1b8}
.k strong{display:block;margin-top:4px;font-size:25px;line-height:1;font-weight:900;
  color:#ffe1a0;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.k strong em{font-style:normal;margin-left:2px;font-size:11.5px;font-weight:900;color:#c2cee2;
  letter-spacing:0}
.k strong.nil{color:#5f6d85}
.brow{margin:0 0 11px}
.brow:last-child{margin-bottom:0}
.bl{display:flex;align-items:baseline;gap:6px;margin:0 0 5px;min-width:0}
.bl b{font-size:11.8px;font-weight:900;color:#e2eaf7;white-space:nowrap}
.bl span{margin-left:auto;font-size:11.4px;font-weight:900;color:#fff;white-space:nowrap;
  font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.bl span i{font-style:normal;font-size:10px;font-weight:800;color:#9aa8bf;margin-left:5px}
.bt{height:10px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.bt i{display:block;height:100%;min-width:0;border-radius:99px;
  background:linear-gradient(90deg,#ffd77a,#ffb928);transition:width .45s cubic-bezier(.3,.9,.3,1)}
.bt.sky i{background:linear-gradient(90deg,#b6d7ff,#7fb6ff)}
.bt.mint i{background:linear-gradient(90deg,#a6f0cd,#4fd4a0)}
.bt.rose i{background:linear-gradient(90deg,#ffc3b8,#ff9f8a)}
.bt.flat i{background:linear-gradient(90deg,#5d6c85,#46536a)}
.big{display:flex;align-items:baseline;gap:6px;margin:-2px 0 10px}
.big strong{font-size:27px;line-height:1.1;font-weight:900;color:#8fe9c2;letter-spacing:-.035em;
  font-variant-numeric:tabular-nums}
.big strong.nil{color:#5f6d85}
.big span{font-size:10.6px;font-weight:900;color:#a4b2c8;letter-spacing:.02em}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.pair div{background:rgba(255,255,255,.035);border:1px solid var(--line2);border-radius:11px;
  padding:9px 11px;min-width:0}
.pair b{display:block;font-size:9px;font-weight:900;letter-spacing:.02em;color:#93a1b8}
.pair span{display:block;margin-top:3px;font-size:13px;line-height:1.3;font-weight:900;color:#eef3fb;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pair span em{font-style:normal;font-size:9.4px;font-weight:800;color:#8e9bb3;margin-left:3px;
  letter-spacing:0}
.tw{display:flex;flex-wrap:wrap;gap:5px}
.tw span{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:8px;
  font-size:10.6px;font-weight:900;letter-spacing:-.01em;color:#cfd9ea;
  background:rgba(255,255,255,.05);border:1px solid var(--line2)}
.tw span b{font-size:9.6px;font-weight:900;color:#ffd98a;font-variant-numeric:tabular-nums}
.sc-note{margin:10px 0 0;font-size:9.6px;font-weight:700;line-height:1.5;color:#7f8ea6}

/* 하루 카드 */
.day{display:block;width:100%;text-align:left;font:inherit;color:var(--txt);cursor:pointer;
  padding:11px 12px;border-radius:14px;margin-bottom:7px;
  background:linear-gradient(180deg,#141d31,#10182a);border:1px solid var(--line);
  transition:transform .16s,border-color .18s,background .18s;position:relative;overflow:hidden}
.day::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:rgba(255,194,71,.0);transition:background .2s}
.day:active{transform:scale(.992);background:#182238}
.day.today{border-color:rgba(255,194,71,.42)}
.day.today::before{background:linear-gradient(180deg,#ffd77a,#ffb020)}
.dh{display:flex;align-items:center;gap:6px;min-width:0}
.dd{font-size:13px;font-weight:900;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.dw{font-size:10.5px;font-weight:900;color:#9fb0c9}
.today-tag{font-size:8px;font-weight:900;letter-spacing:.06em;color:#1c1503;background:var(--gold);
  padding:1px 5px;border-radius:5px}
.wxb{margin-left:auto;font-size:9.5px;font-weight:800;color:#9fb0c9;background:rgba(255,255,255,.05);
  border:1px solid var(--line2);padding:2px 6px;border-radius:7px;white-space:nowrap}
.hl{margin:6px 0 0;font-size:11.8px;line-height:1.5;font-weight:700;color:#dbe4f4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tg{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.tag{font-size:8.8px;font-weight:900;letter-spacing:.01em;padding:2px 6px;border-radius:6px;
  border:1px solid var(--line2);background:rgba(255,255,255,.05);color:#aebbd0;white-space:nowrap}
.tag.good{color:#9fe9c6;background:rgba(52,211,153,.09);border-color:rgba(52,211,153,.26)}
.tag.food{color:#ffd7a6;background:rgba(255,194,71,.09);border-color:rgba(255,194,71,.26)}
.tag.low{color:#ffc3b2;background:rgba(255,159,107,.09);border-color:rgba(255,159,107,.26)}
.tag.ann{color:#bcd2ff;background:rgba(127,182,255,.09);border-color:rgba(127,182,255,.26)}
.tag.special{color:#ffc2e0;background:rgba(255,140,200,.09);border-color:rgba(255,140,200,.26)}
.empty{padding:18px 12px;text-align:center;font-size:11px;color:var(--dim2);
  border:1px dashed var(--line2);border-radius:14px}

/* 공지 카드 */
.notice{padding:11px 12px;border-radius:14px;margin-bottom:7px;background:linear-gradient(180deg,#141d31,#10182a);
  border:1px solid var(--line)}
.nh{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nh b{font-size:11.8px;font-weight:900;min-width:0}
.nh .nb{font-size:8.6px;font-weight:900;padding:2px 6px;border-radius:6px;background:rgba(127,182,255,.10);
  border:1px solid rgba(127,182,255,.26);color:#bcd2ff;white-space:nowrap}
.nh .nd{margin-left:auto;font-size:9px;font-weight:800;color:var(--dim2);font-variant-numeric:tabular-nums}
.np{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}

/* 라이트박스 */

.brief{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}

/* 알림장 원문 팝업 */
.dm{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;

.dm-head{display:flex;align-items:flex-start;gap:9px;padding:13px 14px 10px;

.dm-foot button{width:100%;height:40px;border-radius:11px;cursor:pointer;font:inherit;

  background:linear-gradient(180deg,#b6d7ff,#7fb6ff);border:1px solid rgba(127,182,255,.5)}

.cmt{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}

.sh-foot{flex:0 0 auto;display:flex;gap:7px;padding:9px 16px calc(9px + env(safe-area-inset-bottom,0px));

/* ---------- 접근 인증(PIN 게이트) ---------- */
body.locked .wrap{display:none}
body:not(.locked) .lock{display:none}
.lock{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 20px) 22px calc(env(safe-area-inset-bottom,0px) + 20px);
  background:radial-gradient(120% 58% at 50% -4%, #1a2846 0%, rgba(10,15,30,0) 62%), #080c17}
.lockcard{width:100%;max-width:330px;text-align:center}
.lockbadge{width:62px;height:62px;margin:0 auto 13px;border-radius:19px;display:flex;align-items:center;justify-content:center;
  font-size:27px;background:rgba(255,194,71,.10);border:1px solid rgba(255,194,71,.34);
  box-shadow:0 14px 34px -18px rgba(255,194,71,.85)}
.lockcard h1{margin:0;font-size:21px;font-weight:900;letter-spacing:-.02em}
.lockcard .sub{margin:5px 0 0;font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--dim)}
.dots{display:flex;justify-content:center;gap:13px;margin:22px 0 4px}
.dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid #47566f;display:block;
  transition:background .14s,transform .14s,border-color .14s}
.dots i.on{background:var(--gold);border-color:var(--gold);transform:scale(1.10);box-shadow:0 0 12px rgba(255,194,71,.65)}
.lerr{min-height:17px;margin:7px 0 0;font-size:10.5px;font-weight:800;color:#ff9f9b}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:8px}
.key{height:54px;border-radius:14px;font:inherit;font-size:19px;font-weight:900;color:#eaf1ff;cursor:pointer;
  background:linear-gradient(180deg,#1a2438,#141d2f);border:1px solid var(--line);padding:0;
  font-variant-numeric:tabular-nums;transition:transform .12s,background .15s}
.key:active{transform:scale(.96);background:#22304a}
.key.fn{font-size:14px;color:#a9b8d0;background:transparent;border-color:transparent}
.key.fn:active{background:rgba(255,255,255,.06)}
.key:disabled{opacity:.45}
.shake{animation:shake .34s}
@keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-6px)}}
.lockhint{margin-top:15px;font-size:8.8px;font-weight:700;color:#5f6d85;line-height:1.7}

</style>

<script>
(function(){
  "use strict";
  var FB_URL = "https://seonongs-hq-default-rtdb.firebaseio.com/eunu_vault/eunu_0919_sec/notes.json";
  var PHOTO_BASE = "https://seonongs-hq-default-rtdb.firebaseio.com/eunu_vault/eunu_0919_sec/photos/";
  var ACT_BASE = "https://seonongs-hq-default-rtdb.firebaseio.com/eunu_vault/eunu_0919_sec/activity_photos/";
  var PIN_HASH = "b278d52bfa3225e70001ea4bd9a9070f933b42a5f8153c17890320372210d4aa";  /* SHA-256("0919") */
  var AUTH_KEY = "eunu_auth_v1";
  var BIRTH = new Date(2025, 8, 19);        /* 2025-09-19 */

  var state = { data: { days: [], notices: [], meta: {} }, range: "all", month: "", sortDesc: true, live: false, openIdx: -1, sheetOrder: [], unlocked: false, es: null, timer: null,
                view: "diary", q: "", albumIndex: null, albumPromise: null, actIndex: null, actPromise: null,
                lbList: [], lbIdx: -1, lbFrom: "", pastOpen: false };
  var monthSig = "";
  var photoCache = {};   /* date -> dataURL | null(사진 없음) */
  var hsCache = (typeof WeakMap === "function") ? new WeakMap() : null;   /* day -> 검색용 정규화 문자열 */
  var SYN = { "소고기": "쇠고기", "쇠고기": "소고기" };   /* 한글 표기 차이 보정 */
  var $ = function(id){ return document.getElementById(id); };

  /* ---------- 날짜 helpers ---------- */
  function parseD(s){ var p = s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
  function todayStr(){
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
  function md(s){ return (+s.split("-")[1]) + "/" + (+s.split("-")[2]); }
  function fmtK(d){
    return d.getFullYear() + "년 " + (d.getMonth()+1) + "월 " + d.getDate() + "일";
  }
  function diffDays(a,b){ return Math.round((b-a)/86400000); }

  /* ---------- 렌더 ---------- */
  function days(){ return (state.data.days || []).slice(); }

  function weekOf(d){
    /* 이번 주 = 최신 날짜가 속한 주(월~일) */
    var ds = days();
    if(!ds.length) return null;
    var latest = parseD(ds[0].d);
    var dow = (latest.getDay() + 6) % 7;              /* 월=0 */
    var monday = new Date(latest); monday.setDate(latest.getDate() - dow);
    var sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
    return {monday:monday, sunday:sunday};
  }

  /* ---------- 월별 필터 ---------- */
  function monthKey(s){ return String(s || "").slice(0, 7); }

  function monthSrc(){
    /* 식판·활동 앨범 보기에서는 사진이 있는 날짜 기준으로 월 칩·건수를 만든다 */
    if(state.view === "album" && state.albumIndex){
      return state.albumIndex.map(function(d){ return { d: d }; });
    }
    if(state.view === "act" && state.actIndex){
      return state.actIndex.map(function(d){ return { d: d }; });
    }
    return days();
  }

  function months(){
    /* 월별 소스(state.data.days 또는 앨범 날짜)의 YYYY-MM 을 내림차순 고유 추출 + 건수 */
    var cnt = {}, keys = [];
    monthSrc().forEach(function(x){
      var k = monthKey(x.d);
      if(!/^\d{4}-\d{2}$/.test(k)) return;
      if(!Object.prototype.hasOwnProperty.call(cnt, k)){ cnt[k] = 0; keys.push(k); }
      cnt[k]++;
    });
    keys.sort(function(a, b){ return a < b ? 1 : (a > b ? -1 : 0); });
    return keys.map(function(k){ return { k: k, n: cnt[k] }; });
  }

  function monthLabel(m, showYear){
    var p = m.k.split("-"), mo = +p[1];
    /* 한 해 안이면 '11월 (20)', 연도가 섞이면 '2026.11 (20)' */
    return (showYear ? p[0] + "." + String(mo).padStart(2, "0") : mo + "월") + " (" + m.n + ")";
  }

  function matchesMonth(day){
    return !state.month || monthKey(day.d) === state.month;
  }

  function renderMonths(){
    var box = $("months");
    if(!box) return;
    var ms = months();
    if(ms.length && state.month && !ms.some(function(m){ return m.k === state.month; })) state.month = "";
    var sig = state.view + "|" + ms.map(function(m){ return m.k + ":" + m.n; }).join(",") + "|" + state.month;
    if(sig === monthSig) return;
    monthSig = sig;
    if(!ms.length){ box.innerHTML = ""; box.hidden = true; return; }
    var showYear = ms.some(function(m){ return m.k.slice(0, 4) !== ms[0].k.slice(0, 4); });
    var html = '<span class="mlab">월별</span>' +
      '<button class="chip mon' + (state.month ? "" : " on") + '" type="button" data-m="" aria-pressed="' +
      (state.month ? "false" : "true") + '">전체 월</button>';
    ms.forEach(function(m){
      var on = state.month === m.k;
      html += '<button class="chip mon' + (on ? " on" : "") + '" type="button" data-m="' + m.k +
        '" aria-pressed="' + (on ? "true" : "false") + '">' + esc(monthLabel(m, showYear)) + '</button>';
    });
    box.innerHTML = html;
    box.hidden = false;
    Array.prototype.forEach.call(box.querySelectorAll(".chip.mon"), function(c){
      c.addEventListener("click", function(){
        state.month = c.getAttribute("data-m") || "";
        if(state.month){
          state.range = "all";
          Array.prototype.forEach.call($("filters").querySelectorAll(".chip[data-range]"), function(x){
            x.classList.toggle("on", x.getAttribute("data-range") === "all");
          });
        }
        renderMonths();
        renderView();
      });
    });
  }

  function matchesRange(day){
    if(state.range === "all") return true;
    var w = weekOf(); if(!w) return true;
    var d = parseD(day.d);
    if(state.range === "this") return d >= w.monday && d <= w.sunday;
    var lm = new Date(w.monday); lm.setDate(lm.getDate()-7);
    var ls = new Date(w.sunday); ls.setDate(ls.getDate()-7);
    return d >= lm && d <= ls;
  }

  /* ---------- 키워드 검색 (날짜·메뉴·내용 등 모든 텍스트 대상) ---------- */
  function norm(s){ return String(s == null ? "" : s).toLowerCase().replace(/\s+/g, ""); }

  function dayHay(day){
    if(hsCache && hsCache.has(day)) return hsCache.get(day);
    var p = [day.d, md(day.d), fmtK(parseD(day.d)), day.wd, day.wd ? day.wd + "요일" : "", day.headline, day.summary, day.diaryRaw, day.lunchNote, day.weather];
    if(day.diarySummary) p = p.concat(day.diarySummary);
    if(day.lunch) p = p.concat(day.lunch);
    if(day.snacks) p = p.concat(day.snacks);
    if(day.am) p.push(day.am);
    if(day.pm) p.push(day.pm);
    if(day.tags) p = p.concat(day.tags);
    if(day.checks) p = p.concat(day.checks);
    if(day.comments) day.comments.forEach(function(c){ p.push(c.who, c.x, c.t); });
    ["mood","food","sleep","temp","health","bowel"].forEach(function(k){ if(day[k]) p.push(day[k]); });
    var h = norm(p.join("\u0000"));   /* 필드 경계를 넘는 오탐 방지 */
    if(hsCache) hsCache.set(day, h);
    return h;
  }

  function qTokens(){
    return state.q.trim().toLowerCase().split(/\s+/).filter(function(t){ return t.length > 0; });
  }

  function matchQuery(day){
    var ts = qTokens();
    if(!ts.length) return true;
    var h = dayHay(day);
    for(var i = 0; i < ts.length; i++){
      var t = norm(ts[i]);
      if(h.indexOf(t) >= 0) continue;
      var alt = SYN[t];
      if(alt && h.indexOf(norm(alt)) >= 0) continue;
      return false;
    }
    return true;
  }

  function tagClass(t){
    if(/좋음|많이|정량/.test(t)) return "good";
    if(/적게|눈|비/.test(t)) return "food";
    if(/알림장|공지/.test(t)) return "ann";
    if(/특이|행사|적응|식사 전/.test(t)) return "special";
    return "";
  }

  function renderHero(){
    var meta0 = state.data.meta || {};
    var ch = meta0.child || {};
    if(ch.name) $("whoName").textContent = ch.name;
    if(ch.birth){
      $("whoBirth").innerHTML = ch.birth + " · <b id=\"livedays\">D+" +
        diffDays(parseD(ch.birth), new Date(new Date().getFullYear(), new Date().getMonth(), new Date().getDate())) +
        "</b>";
    }
    var bsub = $("brandSub");
    if(bsub && (ch.center || ch.className)){
      var bsubTxt = ((ch.center || "") + " " + (ch.className || "")).replace(/\s+$/, "");
      if(ch.teacher) bsubTxt += " (" + ch.teacher + ")";
      bsub.textContent = bsubTxt;
    }
    var d = days();
    if(!d.length) return;

    var latest = d.slice().sort(function(a,b){ return a.d < b.d ? 1 : -1; })[0];
    $("hgLatest").textContent = md(latest.d) + " (" + latest.wd + ") " + (latest.diaryRaw ? "알림장" : "기록");

    var w = weekOf();
    var wk = d.filter(function(x){ var t = parseD(x.d); return w && t >= w.monday && t <= w.sunday; });
    var tray = wk.filter(function(x){ return /식판 사진 확인/.test(x.lunchNote || ""); }).length;
    $("hgTray").textContent = tray + " / " + wk.length + "일 확보";

    var meta = state.data.meta || {};
    var label = (meta.week && meta.week.subTopic) ? meta.week.subTopic : "";
    var topicEl = $("hgTopic");
    if(topicEl) topicEl.textContent = label || (wk[0] ? (wk[0].headline.slice(0,14)+"…") : "-");
    var nextEl = $("hgNext");
    if(nextEl){
      var t = wk.filter(function(x){ return x.date === todayStr(); })[0];
      if(!t) t = wk.slice().sort(function(a,b){ return a.d < b.d ? 1 : -1; })[0];
      var cand = (t && t.checks) ? t.checks.slice() : [];
      var shortEv = null;
      cand.forEach(function(c){ if(!shortEv && /이불/.test(c)) shortEv = "낮잠이불 반환"; });
      if(!shortEv){
        var c0 = cand[0] || "새 공지 없음";
        shortEv = c0.length > 16 ? c0.slice(0, 16) + "…" : c0;
      }
      nextEl.textContent = md(t.d) + " · " + shortEv;
    }
  }

  function renderList(){
    var box = $("list");
    var list = days().filter(matchesRange).filter(matchesMonth).filter(matchQuery);
    list.sort(function(a,b){ return state.sortDesc ? (a.d < b.d ? 1 : -1) : (a.d < b.d ? -1 : 1); });
    var cntEl = $("qCnt");
    if(cntEl){
      if(state.q.trim()){ cntEl.textContent = list.length + "일"; cntEl.hidden = false; }
      else { cntEl.hidden = true; }
    }
    if(!list.length){
      var msg;
      if(state.q.trim()){
        msg = '<div class="empty">검색 결과가 없습니다<span class="esub">다른 날짜·메뉴·내용으로 검색해 보세요</span></div>';
      } else if(state.month && !days().some(matchesMonth)){
        msg = '<div class="empty">' + state.month.replace("-", "년 ") + "월에 기록이 없습니다." + '</div>';
      } else {
        msg = '<div class="empty">해당 기간에 기록이 없습니다.</div>';
      }
      box.innerHTML = msg;
      state.sheetOrder = [];
      return;
    }
    var td = todayStr();
    box.innerHTML = list.map(function(day){
      var cls = "day" + (day.d === td ? " today" : "");
      var tags = (day.tags || []).map(function(t){
        return '<span class="tag ' + tagClass(t) + '">' + esc(t) + '</span>';
      }).join("");
      var cnt = (day.comments || []).length;
      return '<button class="' + cls + '" type="button" data-d="' + day.d + '">' +
        '<div class="dh"><span class="dd">' + md(day.d) + '</span><span class="dw">' + esc(day.wd) + '요일</span>' +
        (day.d === td ? '<span class="today-tag">오늘</span>' : '') +
        '<span class="wxb">' + esc(day.weather || "-") + '</span></div>' +
        '<p class="hl">' + esc(day.headline) + '</p>' +
        '<div class="tg">' + tags + (cnt ? '<span class="tag">댓글 ' + cnt + '</span>' : '') + '</div>' +
        '</button>';
    }).join("");
    Array.prototype.forEach.call(box.querySelectorAll(".day"), function(b){
      b.addEventListener("click", function(){ openDay(b.getAttribute("data-d")); });
    });
    state.sheetOrder = list.map(function(x){ return x.d; });
  }

  /* ---------- 공지 · 현재(유효) / 지난 자동 분리 ---------- */
  var NOTICE_FRESH_DAYS = 10;   /* 오늘 기준 최근 10일 이내 = 현재 공지 */

  function dayAge(s){
    if(!s || typeof s !== "string" || s.length < 8) return null;
    var d = parseD(s.slice(0, 10));
    if(!d || isNaN(d.getTime())) return null;
    var t = new Date();
    var t0 = new Date(t.getFullYear(), t.getMonth(), t.getDate());
    return Math.round((t0 - d) / 86400000);
  }

  function noticeIsPast(n){
    if(!n) return false;
    if(n.past === true) return true;
    if(n.past === false) return false;
    var end = n.endDate || n.until || n.expires;
    var ea = end ? dayAge(String(end)) : null;
    if(ea != null && ea > 0) return true;
    var age = dayAge(n.d);
    if(age == null) return false;
    return age > NOTICE_FRESH_DAYS;
  }

  function noticeCard(n, dim){
    return '<article class="notice' + (dim ? " dim" : "") + '"><div class="nh"><b>' + esc(n.title) + '</b>' +
      '<span class="nb">' + esc(n.kind || "공지") + '</span>' +
      '<span class="nd">' + md(n.d) + ' · ' + esc(n.from || "") + '</span></div>' +
      '<ul class="np">' + (n.points||[]).map(function(p){ return '<li>' + esc(p) + '</li>'; }).join("") + '</ul>' +
      '</article>';
  }

  function renderNotices(){
    var all = (state.data.notices || []).slice().sort(function(a,b){ return a.d < b.d ? 1 : -1; });
    var fresh = [], past = [];
    all.forEach(function(n){ (noticeIsPast(n) ? past : fresh).push(n); });

    /* 헤더 배지 = 현재(유효) 공지 건수만 */
    var cnt = $("noticeCnt"), btn = $("noticeBtn");
    if(cnt){
      if(fresh.length){ cnt.textContent = fresh.length; cnt.hidden = false; }
      else { cnt.hidden = true; }
    }
    if(btn){
      btn.setAttribute("aria-label", fresh.length ? "공지 보기 · 새 공지 " + fresh.length + "건" : "공지 보기");
      btn.setAttribute("title", fresh.length ? "공지 " + fresh.length + "건" : "공지");
    }

    var sub = $("nSub");
    if(sub) sub.textContent = !all.length ? "NOTICE" :
      (fresh.length ? "NOTICE " + fresh.length + "건" : "새 공지 없음") + (past.length ? " · 지난 " + past.length : "");

    var box = $("nBody");
    if(!box) return;
    if(!all.length){ box.innerHTML = '<div class="empty">공지가 없습니다.</div>'; return; }

    var html = "";
    if(fresh.length){
      html += fresh.map(function(n){ return noticeCard(n, false); }).join("");
    }else{
      html += '<div class="empty">새 공지가 없습니다.<br>' + (past.length ? "아래에서 지난 공지를 펼쳐 볼 수 있습니다." : "") + '</div>';
    }

    if(past.length){
      var open = !!state.pastOpen;
      html += '<button class="nfold" id="nFold" type="button" aria-expanded="' + (open ? "true" : "false") + '" aria-controls="nPast">' +
        '<span class="ic" aria-hidden="true">📁</span>' +
        '<span class="tx">' + (open ? "지난 공지 접기" : "지난 공지 보기") + '</span>' +
        '<span class="ct">' + past.length + '건</span>' +
        '<span class="ar" aria-hidden="true">' + (open ? "▴" : "▾") + '</span></button>' +
        '<div class="npast" id="nPast"' + (open ? "" : " hidden") + '>' +
        past.map(function(n){ return noticeCard(n, true); }).join("") +
        (open ? '<button class="nfold nfold-b" id="nFoldB" type="button" aria-expanded="true">' +
          '<span class="ar" aria-hidden="true">▴</span><span class="tx">지난 공지 접기</span></button>' : "") +
        '</div>';
    }
    box.innerHTML = html;

    function togglePast(){
      state.pastOpen = !state.pastOpen;
      renderNotices();
      if(state.pastOpen){
        var f2 = $("nFoldB");
        if(f2) f2.scrollIntoView({ block: "nearest" });
      }
    }
    var fb = $("nFold");
    if(fb) fb.addEventListener("click", togglePast);
    var fbb = $("nFoldB");
    if(fbb) fbb.addEventListener("click", togglePast);
  }

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }

  /* ---------- 식판 사진 · 앨범 ---------- */
  var alQueue = [], alActive = 0, alIO = null;
  var AL_MAX = 3;   /* 동시 요청 상한 */

  function byDate(date){
    return days().filter(function(x){ return x.d === date; })[0] || null;
  }

  function dishLine(day){
    if(!day) return "";
    var l = day.lunch || [];
    if(!l.length) return day.lunchNote || "";
    var s = l.slice(0, 3).join("·");
    if(l.length > 3) s += " 외";
    return s;
  }

  function albumList(){
    var idx = state.albumIndex || [];
    return idx.filter(function(d){
      if(!matchesMonth({ d: d })) return false;
      var day = byDate(d);
      return day ? matchQuery(day) : matchQuery({ d: d, wd: "" });
    });
  }

  function renderAlbum(){
    var box = $("agrid"), meta = $("albMeta");
    if(!box) return;
    var idx = state.albumIndex || [];
    var list = albumList();

    if(meta){
      if(!idx.length){
        meta.textContent = "식판 사진을 불러오지 못했습니다";
      } else if(!list.length){
        meta.innerHTML = '식판 <b>0</b>일 <span class="dot"></span> 전체 ' + idx.length + '일';
      } else {
        var newest = list[0], nd = byDate(newest);
        var tail = (state.q.trim() || state.month)
          ? "전체 " + idx.length + "일"
          : "최근 " + md(newest) + (nd && nd.wd ? " " + nd.wd : "");
        meta.innerHTML = '식판 <b>' + list.length + '</b>일 <span class="dot"></span> ' + esc(tail);
      }
    }

    if(!idx.length){
      box.innerHTML = '<div class="empty">등록된 식판 사진이 없습니다</div>';
      state.sheetOrder = [];
      return;
    }
    if(!list.length){
      box.innerHTML = state.q.trim()
        ? '<div class="empty">검색 결과가 없습니다<span class="esub">다른 날짜·메뉴·내용으로 검색해 보세요</span></div>'
        : '<div class="empty">이 달에는 등록된 식판 사진이 없습니다</div>';
      state.sheetOrder = [];
      return;
    }

    box.innerHTML = list.map(function(d){
      var day = byDate(d);
      var wd = (day && day.wd) ? day.wd : "";
      return '<button class="acard" type="button" data-d="' + d + '" aria-label="' + md(d) + ' 식판 사진 크게 보기">' +
        '<span class="aimg" id="ai-' + d + '" data-ad="' + d + '"><span class="ano" aria-hidden="true">🍱</span>' +
        '<img id="aimg-' + d + '" alt="' + md(d) + ' 점심 식판 사진"></span>' +
        '<span class="afoot"><span class="afd"><b>' + md(d) + '</b><span>' + esc(wd) + '</span></span>' +
        '<span class="al">' + esc(dishLine(day)) + '</span></span></button>';
    }).join("");
    state.sheetOrder = list.slice();

    Array.prototype.forEach.call(box.querySelectorAll(".acard"), function(b, i){
      b.addEventListener("click", function(){ openAlbum(i, list); });
    });

    /* 화면에 들어오는 카드만 순차(동시 3) 로딩 → 메모리 캐시 */
    if(alIO){ alIO.disconnect(); alIO = null; }
    if(window.IntersectionObserver){
      alIO = new IntersectionObserver(function(es){
        es.forEach(function(e){
          if(!e.isIntersecting) return;
          alIO.unobserve(e.target);
          queuedPhoto(e.target.getAttribute("data-ad"));
        });
      }, { rootMargin: "260px 0px" });
      Array.prototype.forEach.call(box.querySelectorAll(".aimg"), function(el){ alIO.observe(el); });
    } else {
      list.forEach(queuedPhoto);
    }
  }

  function fillAlbumImg(d, url){
    var im = $("aimg-" + d), fr = $("ai-" + d);
    if(!im || !url) return;
    im.onload = function(){ im.classList.add("on"); if(fr) fr.classList.add("loaded"); };
    im.onerror = function(){ if(fr) fr.classList.remove("loaded"); };
    im.src = url;
  }

  function markNoPhoto(d){
    var fr = $("ai-" + d);
    if(!fr) return;
    fr.classList.add("loaded", "nod");
    var an = fr.querySelector(".ano");
    if(an) an.textContent = "사진 없음";
  }

  function queuedPhoto(d){
    if(Object.prototype.hasOwnProperty.call(photoCache, d)){
      if(photoCache[d]) fillAlbumImg(d, photoCache[d]);
      else markNoPhoto(d);
      return;
    }
    alQueue.push(d);
    pumpAlbum();
  }

  function pumpAlbum(){
    while(alActive < AL_MAX && alQueue.length){
      (function(dd){
        alActive++;
        fetchPhoto(dd)
          .then(function(u){ if(u) fillAlbumImg(dd, u); else markNoPhoto(dd); })
          .catch(function(){})
          .then(function(){ alActive--; pumpAlbum(); });
      })(alQueue.shift());
    }
  }

  function albumIndex(){
    if(state.albumIndex) return Promise.resolve(state.albumIndex);
    if(state.albumPromise) return state.albumPromise;
    /* 사진이 있다는 신호가 있는 날짜만 후보로 삼고, 각 날짜를 shallow로 가볍게 확인한다.
       (상위 photos 경로 목록은 보안 규칙상 읽을 수 없을 수 있다) */
    var cand = days().filter(function(x){
      var n = x.lunchNote || "";
      return /식판/.test(n) && !/미등록/.test(n);
    }).map(function(x){ return x.d; });
    cand.sort(); cand.reverse();
    if(!cand.length){ state.albumIndex = []; return Promise.resolve(state.albumIndex); }

    state.albumPromise = new Promise(function(resolve){
      var found = [], i = 0, active = 0, done = false;
      function finish(){
        if(done) return;
        done = true;
        found.sort(); found.reverse();
        state.albumIndex = found.length ? found : cand.slice();
        state.albumPromise = null;
        resolve(state.albumIndex);
      }
      function next(){
        if(i >= cand.length && active === 0){ finish(); return; }
        while(active < 4 && i < cand.length){
          (function(d){
            active++;
            fetch(PHOTO_BASE + d + ".json?shallow=true", { cache: "no-store" })
              .then(function(r){ return r.ok ? r.json() : null; })
              .then(function(j){ if(j && (j === true || typeof j === "object")) found.push(d); })
              .catch(function(){})
              .then(function(){ active--; next(); });
          })(cand[i++]);
        }
      }
      next();
    });
    return state.albumPromise;
  }

  function loadAlbum(){
    if(state.albumIndex) return;
    var meta = $("albMeta");
    if(meta && !meta.textContent) meta.textContent = "식판 사진 불러오는 중…";
    albumIndex().then(function(){
      renderMonths();
      if(state.view === "album") renderAlbum();
      if(state.view === "stats") renderStats();
    }).catch(function(){});
  }


  /* ---------- 활동 사진 · 앨범 ---------- */
  var actCache = {};        /* date -> items[] | null(사진 없음) */
  var aqQueue = [], aqActive = 0, aqIO = null;
  var AQ_MAX = 3;           /* 동시 요청 상한 */

  function fetchActivity(date){
    if(Object.prototype.hasOwnProperty.call(actCache, date)) return Promise.resolve(actCache[date]);
    return fetch(ACT_BASE + date + ".json", { cache: "no-store" })
      .then(function(r){
        if(!r.ok){
          if(r.status === 404) actCache[date] = null;
          return null;
        }
        return r.json().then(function(j){
          var out = null;
          if(j && j.items && j.items.length){
            out = [];
            for(var i = 0; i < j.items.length; i++){
              var it = j.items[i] || {};
              if(typeof it.src === "string" && it.src.indexOf("data:image") === 0){
                out.push({ id: it.id || (date + "-" + i), cap: it.caption || "", src: it.src });
              }
            }
            if(!out.length) out = null;
          }
          actCache[date] = out;
          return out;
        });
      })
      .catch(function(){ return null; });
  }

  function activityIndex(){
    if(state.actIndex) return Promise.resolve(state.actIndex);
    if(state.actPromise) return state.actPromise;
    /* notes.json의 activityCount(활동 사진 장수)가 1 이상이면 즉시 확정,
       그 밖의 날짜만 각각 shallow로 가볍게 확인한다.
       (상위 activity_photos 경로 목록 조회는 보안 규칙상 401) */
    var known = [], cand = [];
    days().forEach(function(x){
      if(typeof x.activityCount === "number" && x.activityCount > 0) known.push(x.d);
      else cand.push(x.d);
    });
    known.sort(); known.reverse();
    cand.sort(); cand.reverse();
    if(!known.length && !cand.length){ state.actIndex = []; return Promise.resolve(state.actIndex); }

    state.actPromise = new Promise(function(resolve){
      var found = known.slice(), i = 0, active = 0, done = false;
      function finish(){
        if(done) return;
        done = true;
        found.sort(); found.reverse();
        state.actIndex = found;
        state.actPromise = null;
        resolve(state.actIndex);
      }
      function next(){
        if(i >= cand.length && active === 0){ finish(); return; }
        while(active < 4 && i < cand.length){
          (function(d){
            active++;
            fetch(ACT_BASE + d + ".json?shallow=true", { cache: "no-store" })
              .then(function(r){ return r.ok ? r.json() : null; })
              .then(function(j){ if(j && (j === true || typeof j === "object")) found.push(d); })
              .catch(function(){})
              .then(function(){ active--; next(); });
          })(cand[i++]);
        }
      }
      next();
    });
    return state.actPromise;
  }

  function loadAct(){
    if(state.actIndex) return;
    var meta = $("actMeta");
    if(meta && !meta.textContent) meta.textContent = "활동 사진 불러오는 중…";
    activityIndex().then(function(){
      if(state.view !== "act" && state.view !== "stats") return;
      renderMonths();
      renderView();
    }).catch(function(){});
  }

  function actList(){
    return (state.actIndex || []).filter(function(d){ return matchesMonth({ d: d }); });
  }

    if(!idx.length){
      box.innerHTML = '<div class="empty">활동 사진이 아직 없습니다<span class="esub">사진이 적재되면 여기에서 볼 수 있습니다</span></div>';
      state.sheetOrder = [];
      return;

    if(!list.length){
      box.innerHTML = '<div class="empty">이 달에는 활동 사진이 없습니다</div>';
      state.sheetOrder = [];

    }

    box.innerHTML = list.map(function(d){
      var day = byDate(d);
      var wd = (day && day.wd) ? day.wd : "";
      return '<button class="acard" type="button" data-ad="' + d + '" aria-label="' + md(d) + ' 활동 사진 보기">' +
        '<span class="aimg" id="aci-' + d + '"><span class="ano" aria-hidden="true">📸</span>' +
        '<img id="acimg-' + d + '" alt="' + md(d) + ' 활동 사진">' +
        '<span class="acnt" id="acnt-' + d + '"></span></span>' +
        '<span class="afoot"><span class="afd"><b>' + md(d) + '</b><span>' + esc(wd) + '</span></span>' +
        '<span class="al" id="acap-' + d + '">불러오는 중…</span></span></button>';
    }).join("");
    state.sheetOrder = list.slice();

    Array.prototype.forEach.call(box.querySelectorAll(".acard"), function(b, i){
      b.addEventListener("click", function(){ openActLightbox(list[i], 0, "act"); });
    });

    /* 화면에 들어오는 카드만 순차(동시 3) 로딩 → 메모리 캐시 */
    if(aqIO){ aqIO.disconnect(); aqIO = null; }
    if(window.IntersectionObserver){
      aqIO = new IntersectionObserver(function(es){
        es.forEach(function(e){
          if(!e.isIntersecting) return;
          aqIO.unobserve(e.target);
          queuedAct(String(e.target.id || "").replace(/^aci-/, ""));
        });
      }, { rootMargin: "260px 0px" });
      Array.prototype.forEach.call(box.querySelectorAll(".aimg"), function(el){ aqIO.observe(el); });
    }else{
      list.forEach(queuedAct);
    }
  }

  function fillActCard(d, items){
    var im = $("acimg-" + d), fr = $("aci-" + d), cap = $("acap-" + d), badge = $("acnt-" + d);
    if(!im || !items || !items.length) return;

  function markNoAct(d){
    var fr = $("aci-" + d);

    fr.classList.add("loaded", "nod");

    if(an) an.textContent = "사진 없음";

  function queuedAct(d){
    if(Object.prototype.hasOwnProperty.call(actCache, d)){
      if(actCache[d]) fillActCard(d, actCache[d]); else markNoAct(d);
      return;
    }
    aqQueue.push(d);
    pumpAct();
  }

  function pumpAct(){
    while(aqActive < AQ_MAX && aqQueue.length){
      (function(dd){
        aqActive++;
        fetchActivity(dd)
          .then(function(u){ if(u) fillActCard(dd, u); else markNoAct(dd); })
          .catch(function(){})
          .then(function(){ aqActive--; pumpAct(); });
      })(aqQueue.shift());

  /* ---------- 통계 ---------- */
  function statDays(){
    return days().filter(matchesRange).filter(matchesMonth);
  }

  function periodLabel(){
    if(state.month) return state.month.replace("-", "년 ") + "월";
    if(state.range === "this") return "이번 주";
    if(state.range === "last") return "지난 주";
    return "전체 기간";
  }

  function sleepMin(s){
    if(!s || s === "-") return null;
    var t = String(s);
    if(/안\s*잤|안잤|안\s*잠/.test(t)) return -1;
    var m = t.match(/(\d+)\s*시간(?:\s*(\d+)\s*분)?/);
    if(m) return (+m[1]) * 60 + (m[2] ? +m[2] : 0);
    m = t.match(/(\d+)\s*분/);
    if(m) return +m[1];
    return null;
  }

  function fmtMin(v){
    if(v == null) return "–";
    if(v <= 0) return "0분";
    if(v < 60) return v + "분";
    var h = Math.floor(v / 60), m = v % 60;
    return h + "시간" + (m ? " " + m + "분" : "");
  }

  function statsOf(){
    var ds = statDays();
    var o = {
      total: ds.length, tray: 0, act: 0, talk: 0,
      food: { "정량": 0, "많이": 0, "적게": 0, "안 함": 0 }, foodKnown: 0,
      sleep: [], noSleep: 0,
      mood: { "좋음": 0, "보통": 0, "저조": 0 }, moodKnown: 0,
      healthAbn: 0, tempAbn: 0, bowelDays: 0, bowelNone: 0, bowelCnt: 0,
      tags: [], tagTotal: 0
    };
    var tc = {}, tk = [];
    ds.forEach(function(day){
      if(/식판 사진 확인/.test(day.lunchNote || "")) o.tray++;
      if((day.comments || []).length) o.talk++;

      var f = String(day.food || "-");
      if(f !== "-" && f !== ""){
        o.foodKnown++;
        if(/정량/.test(f)) o.food["정량"]++;
        else if(/많이|많음/.test(f)) o.food["많이"]++;
        else if(/적게/.test(f)) o.food["적게"]++;
        else if(/안\s*했|먹지/.test(f)) o.food["안 함"]++;
      }

      var sm = sleepMin(day.sleep);
      if(sm === -1) o.noSleep++;
      else if(sm != null) o.sleep.push({ v: sm, d: day.d });

      var mo = String(day.mood || "-");
      if(mo !== "-" && mo !== ""){
        o.moodKnown++;
        if(/좋음|좋아/.test(mo)) o.mood["좋음"]++;
        else if(/보통/.test(mo)) o.mood["보통"]++;
        else if(/저조|나쁨|안\s*좋/.test(mo)) o.mood["저조"]++;
      }

      var he = String(day.health || "-");
      if(he !== "-" && he !== "" && !/좋음|정상/.test(he)) o.healthAbn++;
      var tp = String(day.temp || "-");
      if(tp !== "-" && tp !== "" && !/정상/.test(tp)) o.tempAbn++;

      var bw = String(day.bowel || "-");
      if(bw !== "-" && bw !== ""){
        o.bowelDays++;
        if(/안\s*했|안\s*함/.test(bw)) o.bowelNone++;
        var cm = bw.match(/(\d+)\s*회/);
        if(cm) o.bowelCnt += (+cm[1]);
      }

      (day.tags || []).forEach(function(t){
        if(!t) return;
        if(!Object.prototype.hasOwnProperty.call(tc, t)){ tc[t] = 0; tk.push(t); }
        tc[t]++;
      });
    });

    if(state.actIndex && state.actIndex.length){
      o.act = state.actIndex.filter(function(d){
        return matchesMonth({ d: d }) && matchesRange({ d: d });
      }).length;
    }
    /* 식판은 실제 사진이 있는 날짜(앨범 인덱스) 기준 — 앨범 탭 건수와 일치시킨다 */
    if(state.albumIndex && state.albumIndex.length){
      o.tray = state.albumIndex.filter(function(d){
        return matchesMonth({ d: d }) && matchesRange({ d: d });
      }).length;
    }

    tk.sort(function(a, b){ return tc[b] - tc[a] || (a < b ? -1 : 1); });
    o.tags = tk.slice(0, 10).map(function(t){ return { t: t, n: tc[t] }; });
    o.tagTotal = tk.length;
    return o;
  }

  function kpi(label, n, unit){
    var nil = (n == null || n === 0);
    return '<div class="k"><b>' + esc(label) + '</b><strong' + (nil ? ' class="nil"' : '') + '>' +
      (n == null ? "–" : n) + '<em>' + (n == null ? "" : unit) + '</em></strong></div>';
  }

  function barRow(label, n, denom, cls, unit){
    var pct = denom > 0 ? Math.round(n / denom * 100) : 0;
    return '<div class="brow"><div class="bl"><b>' + esc(label) + '</b>' +
      '<span>' + n + (unit || "일") + (denom > 0 ? '<i>' + pct + '%</i>' : '') + '</span></div>' +
      '<div class="bt' + (cls ? ' ' + cls : '') + '"><i style="width:' + pct + '%"></i></div></div>';
  }

  function renderStats(){
    var box = $("stats");
    if(!box) return;
    var o = statsOf();
    if(!o.total){
      box.innerHTML = '<div class="empty">이 기간에 기록이 없습니다<span class="esub">다른 달이나 기간을 선택해 보세요</span></div>';
      return;
    }
    var h = "";

    /* ① 등원 · 기록 요약 */
    h += '<div class="sc"><div class="sc-h"><b>📅 등원 · 기록</b><span>' + esc(periodLabel()) + '</span></div>' +
      '<div class="kpi">' +
      kpi("등원 일수", o.total, "일") +
      kpi("식판 사진", o.tray, "일") +
      kpi("활동 사진", state.actIndex ? o.act : null, "일") +
      kpi("댓글 소통", o.talk, "일") +
      '</div></div>';

    /* ② 식사량 분포 */
    h += '<div class="sc"><div class="sc-h"><b>🍚 식사량 분포</b><span>기록 ' + o.foodKnown + '일</span></div>' +
      (o.foodKnown
        ? barRow("정량", o.food["정량"], o.foodKnown) +
          barRow("많이", o.food["많이"], o.foodKnown) +
          barRow("적게", o.food["적게"], o.foodKnown) +
          (o.food["안 함"] ? barRow("식사 안 함", o.food["안 함"], o.foodKnown, "flat") : "")
        : '<p class="sc-note" style="margin:0">식사량 기록이 있는 날이 없습니다</p>') +
      '</div>';

    /* ③ 낮잠 */
    var lo = null, hi = null, sum = 0, b1 = 0, b2 = 0, b3 = 0;
    o.sleep.forEach(function(x){
      sum += x.v;
      if(!hi || x.v > hi.v) hi = x;
      if(!lo || x.v < lo.v) lo = x;
      if(x.v < 60) b1++; else if(x.v < 90) b2++; else b3++;
    });
    var sn = o.sleep.length;
    var avg = sn ? Math.round(sum / sn) : null;

  /* ---------- 상세 ---------- */
  var LABELS = [["mood","기분"],["food","식사"],["sleep","낮잠"],["temp","체온"],["health","건강"],["bowel","배변"]];

  function openDay(date){
    var day = days().filter(function(x){ return x.d === date; })[0];
    if(!day) return;
    closeDiary();
    state.openIdx = date;
    $("sheetTitle").textContent = fmtK(parseD(day.d)) + " (" + day.wd + ")";
    $("sheetSub").textContent = (day.weather ? day.weather + " · " : "") + (day.tags || []).join(" · ");

    var html = "";
    /* 생활기록 */
    var hasStat = LABELS.some(function(p){ var v = day[p[0]]; return v && v !== "-"; });
    if(hasStat){
      html += '<div class="stat">' + LABELS.map(function(p){
        var v = day[p[0]];
        return '<div class="st"><b>' + p[1] + '</b><span class="' + (!v || v === "-" ? "dim" : "") + '">' + esc(v || "-") + '</span></div>';
      }).join("") + '</div>';
    } else {
      html += '<p class="note" style="margin-top:2px">이 날은 생활기록 없이 알림장·댓글만 있습니다.</p>';

      (/식판 사진 확인/.test(day.lunchNote || "") ? "식판 확인 ✓" : (/생일/.test(day.lunchNote || "") ? "생일식단" : "사진 미등록")) +
      '</i></h3>' +
      '<ul class="meal">' + (day.lunch || []).map(function(m, i){
        return '<li><em>' + (names[i] || "·") + '</em><span>' + esc(m) + '</span></li>';
      }).join("") + '</ul>' +
      (day.lunchNote ? '<p class="note">' + esc(day.lunchNote) + '</p>' : '') + '</div>';

    /* 식판 사진 — 탭할 때만 Firebase에서 지연 로딩 */
    html += '<div class="sect" id="traySect" hidden><h3><em>🍱</em>오늘의 식판<i>탭하면 크게</i></h3>' +
      '<button class="traybtn" id="trayBtn" type="button" aria-label="식판 사진 크게 보기">' +
      '<img id="trayImg" alt="' + esc(md(day.d)) + ' 점심 식판 사진"><span class="tl">' + esc(md(day.d)) + '</span>' +
      '<span class="zt">🔍 확대</span></button></div>';

    /* 활동 사진 — 식판 사진 아래 가로 스트립 (탭하면 라이트박스) */
    html += '<div class="sect" id="actSect" hidden><h3><em>📸</em>활동 사진<i>탭하면 크게</i></h3>' +
      '<div class="astrip" id="actStrip"></div></div>';

    /* 간식 */
    html += '<div class="sect"><h3><em>🥣</em>간식</h3>' +
      '<ul class="meal">' +
      '<li><em>오전</em><span>' + esc(day.am || "-") + '</span></li>' +
      '<li><em>오후</em><span>' + esc(day.pm || "-") + '</span></li>' +
      '</ul></div>';

    /* 알림장 */
    html += '<div class="sect"><h3><em>💌</em>선생님 알림장</h3>' +
      '<ul class="brief">' + (day.diarySummary || []).map(function(s){ return '<li>' + esc(s) + '</li>'; }).join("") + '</ul>' +
      (day.diaryRaw ? '<button class="rawbtn" type="button" id="rawToggle" aria-haspopup="dialog">📄 알림장 원문 보기</button>' : '') + '</div>';

    /* 댓글 */
    if((day.comments || []).length){
      html += '<div class="sect"><h3><em>💬</em>댓글 흐름</h3><ul class="cmt">' +
        day.comments.map(function(c){
          return '<li><div class="ch"><b>' + esc(c.who) + '</b><span class="tm">' + esc(c.t) + '</span></div><p>' + esc(c.x) + '</p></li>';
        }).join("") + '</ul></div>';
    }

    /* 체크포인트 */
    if((day.checks || []).length){
      html += '<div class="sect"><h3><em>📌</em>체크포인트 · 특이사항</h3><ul class="chk">' +
        day.checks.map(function(c){ return '<li>' + esc(c) + '</li>'; }).join("") + '</ul></div>';
    }

    $("sheetBody").innerHTML = html;
    var rt = $("rawToggle");
    if(rt){ rt.addEventListener("click", function(){ openDiary(day.d); }); }

    var order = state.sheetOrder.length ? state.sheetOrder : [day.d];
    var i = order.indexOf(day.d);
    $("prevDay").disabled = i <= 0;
    $("nextDay").disabled = i < 0 || i >= order.length - 1;

    $("trayBtn").addEventListener("click", openPhoto);
    loadTray(day.d);
    loadActStrip(day.d);

    var w = $("sheetWrap"); w.hidden = false;
    requestAnimationFrame(function(){ w.classList.add("on"); });

  /* ---------- 알림장 원문 팝업 ---------- */
  function openDiary(date){
    var day = byDate(date);
    if(!day || !day.diaryRaw) return;
    $("dSub").textContent = fmtK(parseD(day.d)) + " (" + day.wd + ")" +
      (day.weather ? " · " + day.weather : "") +
      (((state.data.meta || {}).child || {}).className ? " · " + state.data.meta.child.className : "");

    $("dBody").scrollTop = 0;
    var w = $("dWrap"); w.hidden = false;
    requestAnimationFrame(function(){ w.classList.add("on"); });
  }

  function closeDiary(){
    var w = $("dWrap");
    if(!w || w.hidden) return;
    w.classList.remove("on");
    setTimeout(function(){ if(!w.classList.contains("on")) w.hidden = true; }, 180);
  }

  function closeSheet(){
    closeDiary();
    var w = $("sheetWrap");
    w.classList.remove("on");
    document.body.style.overflow = "";
    setTimeout(function(){ w.hidden = true; }, 180);
    state.openIdx = -1;
  }

  function openNotices(){
    state.pastOpen = false;
    renderNotices();
    var w = $("nWrap"); w.hidden = false;
    requestAnimationFrame(function(){ w.classList.add("on"); });
    document.body.style.overflow = "hidden";
    $("nBody").scrollTop = 0;
  }

  function closeNotices(){
    var w = $("nWrap");
    if(w.hidden) return;
    w.classList.remove("on");
    if($("sheetWrap").hidden) document.body.style.overflow = "";
    setTimeout(function(){ w.hidden = true; }, 180);
  }

  /* ---------- 식판 사진 지연 로딩 ---------- */
  function fetchPhoto(date){
    if(Object.prototype.hasOwnProperty.call(photoCache, date)) return Promise.resolve(photoCache[date]);
    return fetch(PHOTO_BASE + date + ".json", { cache: "no-store" })
      .then(function(r){
        if(r.status === 404){ photoCache[date] = null; return null; }
        if(!r.ok) throw new Error("http " + r.status);
        return r.json().then(function(j){
          var u = (j && typeof j.img === "string" && j.img.indexOf("data:image/jpeg;base64,") === 0) ? j.img : null;
          photoCache[date] = u;
          return u;
        });
      });
  }

  function showTray(url){
    var sect = $("traySect"), img = $("trayImg");
    if(!sect || !img || !url) return;
    img.onerror = function(){ sect.hidden = true; };
    img.src = url;
    sect.hidden = false;
  }

  function loadTray(date){
    var sect = $("traySect");
    if(!sect) return;
    sect.hidden = true;
    var img = $("trayImg"); if(img) img.removeAttribute("src");
    var want = date;
    fetchPhoto(date)
      .then(function(u){ if(u && state.openIdx === want) showTray(u); })
      .catch(function(){});
  }

  /* ---------- 라이트박스 (앨범 넘기기 · 날짜 상세 연결) ---------- */
  function openLightbox(items, i, from){
    state.lbList = items || [];
    state.lbIdx = Math.max(0, Math.min(i || 0, state.lbList.length - 1));
    state.lbFrom = from || "day";
    if(!state.lbList.length) return;
    paintLightbox();
    var w = $("lb");
    w.hidden = false;
    w.classList.add("hasbar");
    requestAnimationFrame(function(){ w.classList.add("on"); });
    document.body.style.overflow = "hidden";
  }

  function paintLightbox(){
    var it = state.lbList[state.lbIdx];
    if(!it) return;
    var img = $("lbImg");
    $("lbBar").hidden = false;
    $("lbDate").textContent = fmtK(parseD(it.d)) + (it.wd ? " (" + it.wd + ")" : "");
    if(it.kind === "act"){
      var acap = String(it.cap || "");
      var apre = (it.n > 1 && !/\d+\s*\/\s*\d+/.test(acap)) ? (it.idx + 1) + " / " + it.n + " · " : "";
      $("lbMeal").textContent = apre + (acap || "활동 사진");
    }else{
      $("lbMeal").textContent = it.meal || "점심 식판 사진";
    }
    $("lbPrev").hidden = state.lbIdx <= 0;
    $("lbNext").hidden = state.lbIdx >= state.lbList.length - 1;
    var go = $("lbGo");
    go.hidden = !((state.lbFrom === "album" || state.lbFrom === "act") && byDate(it.d));
    go.setAttribute("data-d", it.d);
    img.alt = md(it.d) + (it.kind === "act" ? " 활동 사진 확대" : " 점심 식판 사진 확대");

    var url = it.url || (Object.prototype.hasOwnProperty.call(photoCache, it.d) ? photoCache[it.d] : null);
    if(url){ it.url = url; img.src = url; return; }
    img.removeAttribute("src");
    var want = it.d;
    fetchPhoto(want).then(function(u){
      if(!u) return;
      it.url = u;
      var cur = state.lbList[state.lbIdx];
      if(cur && cur.d === want) $("lbImg").src = u;
    }).catch(function(){});
  }

  function lbStep(dir){
    var j = state.lbIdx + dir;
    if(!state.lbList.length || j < 0 || j >= state.lbList.length) return;
    state.lbIdx = j;
    paintLightbox();
  }

  function openAlbum(i, list){
    var items = list.map(function(d){
      var day = byDate(d);
      return { d: d, url: Object.prototype.hasOwnProperty.call(photoCache, d) ? photoCache[d] : null,
               meal: dishLine(day), wd: (day && day.wd) ? day.wd : "" };
    });
    openLightbox(items, i, "album");
  }

  function openPhoto(){
    var t = $("trayImg");
    var u = t && t.getAttribute("src");
    if(!u) return;
    var d = state.openIdx;
    var day = byDate(d);
    openLightbox([{ d: d, url: u, meal: dishLine(day), wd: (day && day.wd) ? day.wd : "" }], 0, "day");
  }

  function closePhoto(){
    var w = $("lb");
    if(w.hidden) return;
    w.classList.remove("on");
    setTimeout(function(){
      if(w.classList.contains("on")) return;
      w.hidden = true;
      w.classList.remove("hasbar");
      $("lbImg").removeAttribute("src");
      $("lbBar").hidden = true;
      $("lbPrev").hidden = true;
      $("lbNext").hidden = true;
      state.lbList = []; state.lbIdx = -1; state.lbFrom = "";
    }, 175);
    if($("sheetWrap").hidden && $("nWrap").hidden) document.body.style.overflow = "";
  }

  function step(dir){
    var order = state.sheetOrder;
    var i = order.indexOf(state.openIdx);
    var j = i + dir;
    if(j < 0 || j >= order.length) return;
    openDay(order[j]);
  }

  /* ---------- 데이터 ---------- */
  function setLive(ok, label){
    state.live = ok;
    var el = $("live");
    el.classList.toggle("off", !ok);
    $("liveTxt").textContent = label || (ok ? "LIVE" : "내장");
  }

  function applyData(d, source){
    if(!d || !d.days || !d.days.length) return false;
    state.data = d;
    render();
    setLive(source === "firebase", source === "firebase" ? "LIVE" : "내장");
    return true;
  }

  function stamp(){
    var d = new Date();
    $("syncAt").textContent = String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
  }

  function pull(manual){
    if(!state.unlocked) return Promise.resolve(false);
    var btn = $("refresh");
    if(manual) btn.classList.add("spin");
    return fetch(FB_URL + "?ts=" + Date.now(), { cache: "no-store" })
      .then(function(r){ if(!r.ok) throw new Error("http " + r.status); return r.json(); })
      .then(function(j){ applyData(j, "firebase"); stamp(); return true; })
      .catch(function(){ setLive(false, "내장"); stamp(); return false; })
      .then(function(ok){ if(manual) setTimeout(function(){ btn.classList.remove("spin"); }, 400); return ok; });
  }

  function subscribe(){
    if(!window.EventSource || state.es) return;
    try{
      var es = new EventSource(FB_URL);
      state.es = es;
      es.onmessage = function(ev){
        try{
          var p = JSON.parse(ev.data);
          var d = (p && p.data) ? p.data : null;
          if(d && d.days) applyData(d, "firebase");
        }catch(e){}
      };
      es.onerror = function(){ setLive(false, "내장"); };
    }catch(e){}
  }

  function stopLive(){
    if(state.es){ try{ state.es.close(); }catch(e){} state.es = null; }
    if(state.timer){ clearInterval(state.timer); state.timer = null; }
  }

  /* ---------- 새로고침 (↻ · ?v= 캐시 우회) ---------- */
  function targetUrl(){
    var u = location.pathname + location.search;
    u = u.replace(/([?&])v=\d+/g, function(t, s){ return s === "?" ? "?" : ""; });
    u = u.replace(/\?&/, "?").replace(/[?&]$/, "");
    return u + (u.indexOf("?") >= 0 ? "&" : "?") + "v=" + Date.now();
  }

  function hardReload(){
    location.replace(targetUrl());
  }

  function renderView(){
    if(state.view === "album") renderAlbum();
    else if(state.view === "act") renderAct();
    else if(state.view === "stats") renderStats();
    else renderList();
  }

  function render(){
    renderHero(); renderMonths();
    renderView();
    renderNotices();
  }

  /* ---------- 보기 전환 · 검색 ---------- */
  function refreshList(){
    renderMonths();
    renderView();
  }

  function setView(v){
    if(state.view === v) return;
    state.view = v;
    Array.prototype.forEach.call(document.querySelectorAll(".vbtn"), function(b){
      var on = b.getAttribute("data-view") === v;
      b.classList.toggle("on", on);
      b.setAttribute("aria-selected", on ? "true" : "false");
    });
    var diary = v === "diary", alb = v === "album", act = v === "act", st = v === "stats";
    $("filters").hidden = !diary;
    $("list").hidden = !diary;
    $("album").hidden = !alb;
    $("act").hidden = !act;
    $("stats").hidden = !st;
    var sr = $("srow");
    if(sr) sr.hidden = act || st;
    renderMonths();
    renderView();
    if(alb) loadAlbum();
    if(act) loadAct();
    if(st){ loadAct(); loadAlbum(); renderStats(); }
  }

  /* ---------- 이벤트 ---------- */
  Array.prototype.forEach.call(document.querySelectorAll(".vbtn"), function(b){
    b.addEventListener("click", function(){ setView(b.getAttribute("data-view")); });
  });

  var qInp = $("q");
  qInp.addEventListener("input", function(){
    state.q = qInp.value;
    $("qClear").hidden = !state.q.length;
    refreshList();
  });
  qInp.addEventListener("keydown", function(e){
    if(e.key === "Escape"){
      if(qInp.value){ qInp.value = ""; state.q = ""; $("qClear").hidden = true; refreshList(); }
      e.stopPropagation();
      qInp.blur();
    }
  });
  $("qClear").addEventListener("click", function(){
    qInp.value = ""; state.q = ""; $("qClear").hidden = true;
    refreshList();
    qInp.focus();
  });

  $("refresh").addEventListener("click", function(){
    var b = this;
    b.classList.remove("spin");
    void b.offsetWidth;
    b.classList.add("spin");
    if(state.unlocked) pull(true);
    setTimeout(hardReload, 260);
  });
  Array.prototype.forEach.call($("filters").querySelectorAll(".chip[data-range]"), function(c){
    c.addEventListener("click", function(){
      state.range = c.getAttribute("data-range");
      state.month = "";                     /* 범위 선택 시 월 필터는 전체 월로 리셋 */
      Array.prototype.forEach.call($("filters").querySelectorAll(".chip[data-range]"), function(x){
        x.classList.toggle("on", x === c);
      });
      renderMonths();
      renderView();
    });

  $("sortBtn").addEventListener("click", function(){
    state.sortDesc = !state.sortDesc;
    $("sortBtn").textContent = "최신순 " + (state.sortDesc ? "↓" : "↑");
    renderView();
  });
  $("sheetClose").addEventListener("click", closeSheet);
  $("sheetBg").addEventListener("click", closeSheet);
  $("prevDay").addEventListener("click", function(){ step(-1); });
  $("nextDay").addEventListener("click", function(){ step(1); });
  $("noticeBtn").addEventListener("click", openNotices);
  $("nClose").addEventListener("click", closeNotices);
  $("nBg").addEventListener("click", closeNotices);
  $("dClose").addEventListener("click", closeDiary);
  $("dOk").addEventListener("click", closeDiary);
  $("dBg").addEventListener("click", closeDiary);
  $("lbClose").addEventListener("click", closePhoto);
  $("lb").addEventListener("click", function(e){ if(e.target.id === "lb") closePhoto(); });
  $("lbPrev").addEventListener("click", function(e){ e.stopPropagation(); lbStep(-1); });
  $("lbNext").addEventListener("click", function(e){ e.stopPropagation(); lbStep(1); });
  $("lbGo").addEventListener("click", function(e){
    e.stopPropagation();
    var d = this.getAttribute("data-d");
    if(!d || !byDate(d)) return;
    closePhoto();
    openDay(d);
  });
  (function(){
    var sx = 0, sy = 0, st = false;
    var lb = $("lb");
    lb.addEventListener("touchstart", function(e){
      if(!state.lbList.length || e.touches.length !== 1){ st = false; return; }
      st = true; sx = e.touches[0].clientX; sy = e.touches[0].clientY;
    }, { passive: true });
    lb.addEventListener("touchend", function(e){
      if(!st) return;
      st = false;
      var t = e.changedTouches[0];
      if(!t) return;
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if(Math.abs(dx) < 44 || Math.abs(dx) < Math.abs(dy)) return;
      lbStep(dx < 0 ? 1 : -1);
    }, { passive: true });
  })();
  document.addEventListener("keydown", function(e){
    if(!$("lb").hidden){
      if(e.key === "Escape"){ closePhoto(); return; }
      if(e.key === "ArrowLeft"){ lbStep(-1); return; }
      if(e.key === "ArrowRight"){ lbStep(1); return; }
    }
    if(e.key === "Escape"){
      if(!$("dWrap").hidden){ closeDiary(); return; }
      if(!$("nWrap").hidden){ closeNotices(); return; }
      if(!$("sheetWrap").hidden){ closeSheet(); return; }
    }
    if($("sheetWrap").hidden || !$("dWrap").hidden) return;
    if(e.key === "ArrowLeft") step(-1);
    if(e.key === "ArrowRight") step(1);
  });

  /* ---------- 접근 인증 ---------- */
  function sha256(s){
    if(!(window.crypto && window.crypto.subtle)) return Promise.reject(new Error("no crypto"));
    var buf = new TextEncoder().encode(s);
    return crypto.subtle.digest("SHA-256", buf).then(function(h){
      return Array.prototype.map.call(new Uint8Array(h), function(b){ return ("0"+b.toString(16)).slice(-2); }).join("");
    });
  }

  var pin = "";
  function paintDots(){
    var ds = $("dots").children;
    for(var i=0;i<ds.length;i++) ds[i].classList.toggle("on", i < pin.length);
  }

  function lockErr(msg){
    $("lockErr").textContent = msg || "";
    if(msg){
      var c = $("lockCard"); c.classList.remove("shake");
      void c.offsetWidth; c.classList.add("shake");
      setTimeout(function(){ c.classList.remove("shake"); }, 380);
    }
  }

  function unlock(remember){
    state.unlocked = true;
    document.body.classList.remove("locked");
    pin = ""; paintDots(); lockErr("");
    if(remember){
      try{ localStorage.setItem(AUTH_KEY, PIN_HASH); }catch(e){}
    }
    startApp();
  }

  function typeKey(k){
    if(k === "del"){ pin = pin.slice(0, -1); paintDots(); return; }
    if(k === "clear"){ pin = ""; paintDots(); lockErr(""); return; }
    if(!/^[0-9]$/.test(k) || pin.length >= 4) return;
    pin += k; paintDots(); lockErr("");
    if(pin.length === 4){
      sha256(pin).then(function(hex){
        if(hex === PIN_HASH){ unlock(true); }
        else { pin = ""; paintDots(); lockErr("PIN이 맞지 않습니다"); }
      }).catch(function(){ lockErr("이 환경에서는 인증을 쓸 수 없습니다"); });
    }
  }

  function startApp(){
    render();
    stamp();
    setLive(false, "내장");
    pull(false);
    subscribe();
    if(!state.timer) state.timer = setInterval(function(){ if(!state.live) pull(false); }, 10000);
  }

  /* ---------- 시작 ---------- */
  $("pad").addEventListener("click", function(e){
    var b = e.target.closest(".key");
    if(!b) return;
    typeKey(b.getAttribute("data-k"));
  });
  document.addEventListener("keydown", function(e){
    if(state.unlocked) return;
    if(/^[0-9]$/.test(e.key)) typeKey(e.key);
    else if(e.key === "Backspace") typeKey("del");
    else if(e.key === "Escape") typeKey("clear");
  });

  document.body.classList.add("locked");
  var saved = null;
  try{ saved = localStorage.getItem(AUTH_KEY); }catch(e){}
  if(saved && saved === PIN_HASH){ unlock(false); }
})();
</script>
</body>
</html>
